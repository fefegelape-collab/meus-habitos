<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Hábitos">
<meta name="theme-color" content="#EDF1EE"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="manifest" href="manifest.json"><style>input,textarea,select{font-size:16px!important;-webkit-user-select:text!important;user-select:text!important;touch-action:manipulation}</style></head><body>
<title>Meus Hábitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: single mobile column (max 560px), day header + ring summary, habit rows grouped by category, fixed bottom tab bar */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --sunk:#E2E8E4; --ink:#14251E; --muted:#5B6D65; --line:#D3DCD7;
  --accent:#2F54D6; --accent-ink:#FFFFFF;
  --diet:#2B8A55; --move:#DB5A2A; --med:#1F6FB2; --self:#B8497A; --read:#A06D0C; --other:#7657D2;
  --danger:#C23A3A;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --surface:#16211C; --sunk:#1E2A25; --ink:#E4EDE8; --muted:#92A49B; --line:#2A3831;
  --accent:#8199FF; --accent-ink:#0E1613; --diet:#5AC98A; --move:#FF8C5E; --med:#6CB4F0; --self:#F08AB8; --read:#E6B454; --other:#B19BFF; --danger:#FF7A7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211C; --sunk:#1E2A25; --ink:#E4EDE8; --muted:#92A49B; --line:#2A3831;
  --accent:#8199FF; --accent-ink:#0E1613; --diet:#5AC98A; --move:#FF8C5E; --med:#6CB4F0; --self:#F08AB8; --read:#E6B454; --other:#B19BFF; --danger:#FF7A7A; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-top:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:-.01em}
.mode{font-size:12px;color:var(--muted)}
.daynav{display:flex;align-items:center;gap:6px}
.daynav h1{font-size:clamp(26px,7vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.05;flex:1;min-width:0}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.chip.link{color:var(--accent)}

/* Summary */
.summary{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ring text{font-family:var(--f-display);font-weight:800;fill:var(--ink)}
.sumtext{display:flex;flex-direction:column;gap:10px;min-width:0}
.sumtext p{margin:0;color:var(--muted);font-size:14px}
.sumtext strong{color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:2px 0;border-radius:8px}
.wd .dot{width:22px;height:22px;border-radius:50%;background:var(--sunk);position:relative;overflow:hidden}
.wd .dot i{position:absolute;inset:auto 0 0 0;background:var(--accent)}
.wd.sel{color:var(--ink);font-weight:700}
.wd.sel .dot{outline:2px solid var(--ink);outline-offset:1px}
.wd.future{opacity:.35;cursor:default}

/* Groups & habits */
.group{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;align-items:center;gap:8px}
.ghead .sw{width:8px;height:8px;border-radius:2px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.habit{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.habit:first-child{border-top:0}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;transition:background .15s}
.check svg{opacity:0;transition:opacity .15s}
.habit.done .check{background:var(--c)}
.habit.done .check svg{opacity:1}
.hinfo{min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px;padding:0}
.hname{font-weight:600;overflow-wrap:anywhere}
.habit.done .hname{color:var(--muted)}
.hmeta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.hmeta .streak{color:var(--c);font-weight:600}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:30px;height:30px;border-radius:50%;background:var(--sunk);font-size:18px;line-height:1;display:grid;place-items:center}
.stepper .val{min-width:44px;text-align:center;font-weight:700;font-size:14px}
.bar{height:4px;border-radius:2px;background:var(--sunk);grid-column:2 / 4;margin-top:-4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.cat-dieta{--c:var(--diet)} .cat-movimento{--c:var(--move)} .cat-medico{--c:var(--med)} .cat-pessoal{--c:var(--self)} .cat-leitura{--c:var(--read)} .cat-outro{--c:var(--other)}

.addbtn{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px}
.empty p{margin:0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.ghost{padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600}

/* History */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mhead h2{font-size:20px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cell{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--sunk);font-size:12px;display:flex;align-items:flex-start;justify-content:flex-start;padding:4px 5px;position:relative;color:var(--ink)}
.cell.lv1{background:color-mix(in srgb,var(--accent) 22%,var(--sunk))}
.cell.lv2{background:color-mix(in srgb,var(--accent) 48%,var(--sunk))}
.cell.lv3{background:color-mix(in srgb,var(--accent) 75%,var(--sunk));color:var(--accent-ink)}
.cell.lv4{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell.future{opacity:.35;cursor:default}
.legend{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.legend span{width:12px;height:12px;border-radius:3px;display:inline-block}
.hstat{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding-top:12px;border-top:1px solid var(--line)}
.hstat:first-of-type{border-top:0;padding-top:0}
.hstat .pct{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);text-align:right}
.strip{grid-column:1 / -1;display:grid;grid-template-columns:repeat(28,1fr);gap:2px}
.strip i{height:14px;border-radius:2px;background:var(--sunk)}
.strip i.on{background:var(--c)}
.strip i.part{background:color-mix(in srgb,var(--c) 40%,var(--sunk))}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* Books */
.goalrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.big{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em}
.big small{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:0}
.pbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--read)}
.book{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.book:first-child{border-top:0}
.spine{width:30px;height:40px;border-radius:4px;background:var(--read);display:grid;place-items:center;color:var(--surface)}
.spine.audio{border-radius:50%;width:36px;height:36px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.mini{padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
/* Tasks */
.pri-urgente{--c:var(--danger)} .pri-importante{--c:var(--move)} .pri-necessario{--c:var(--med)}
.quick{display:flex;flex-direction:column;gap:10px}
.quick .in{display:flex;gap:8px}
.quick input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.quick .primary{padding:10px 16px}
.seg.pri button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.task{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .check{width:28px;height:28px;border-radius:8px}
.task.done .check{background:var(--c)} .task.done .check svg{opacity:1}
.task.done .hname{text-decoration:line-through;color:var(--muted)}
.due.late{color:var(--danger);font-weight:600}
.count{font-family:var(--f-display);font-weight:800;color:var(--c)}
/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
.tabs .inner{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:560px;background:var(--sunk);padding:4px;border-radius:99px}
.tabs button{padding:9px 4px;font-size:14px;border-radius:99px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgb(8 14 12 / .45);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:0 8px}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-height:92%;overflow:auto}
.sheet h2{font-size:22px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline .field{flex:1;min-width:120px}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.primary{padding:11px 20px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.danger{color:var(--danger);font-weight:600;padding:10px 4px}
.danger.armed{background:var(--danger);color:var(--surface);padding:10px 16px;border-radius:99px}
.err{color:var(--danger);font-size:13px;margin:0}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
/* Dieta */
.tabs{padding-inline:10px!important}
.tabs .inner{grid-template-columns:repeat(6,auto)!important;gap:0;justify-content:space-between}
.tabs button{font-size:12.5px;padding:9px 7px;white-space:nowrap}
.meal.move{--c:var(--move)}
.wk{display:flex;gap:4px;align-items:center}
.wk i{width:10px;height:10px;border-radius:50%;background:var(--sunk);display:block}
.wk i.on{background:var(--c)}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.ex:first-child{border-top:0}
.ex .sr{font-weight:700;white-space:nowrap;text-align:right}
.ex .ld{font-size:12.5px;color:var(--muted)}
.sslabel{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--c);padding:12px 14px 4px;border-top:1px solid var(--line)}
.next{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--c);color:var(--surface);margin-left:6px;vertical-align:1px}
.zones{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:0 0 12px}
.zones b{color:var(--ink)}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;--c:var(--diet)}
.mhd{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:14px}
.mhd .time{font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--c);letter-spacing:.02em}
.mhd h3{font-size:19px;font-weight:800;letter-spacing:-.01em}
.mhd .sub{font-size:12.5px;color:var(--muted)}
.meal.done .check{background:var(--c)} .meal.done .check svg{opacity:1}
.opts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:12px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.opt:first-child{border-top:0}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center}
.opt.sel{background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.opt.sel .radio{border-color:var(--c);background:var(--c)}
.opt.sel .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--surface)}
.oname{font-weight:700;display:block}
.oitems{font-size:13.5px;color:var(--muted);display:block;margin-top:2px}
.oitems b{color:var(--ink);font-weight:600}
details.more{border-top:1px solid var(--line);padding:0 14px}
details.more summary{cursor:pointer;padding:11px 0;font-size:13px;font-weight:600;color:var(--c);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"− "}
details.more ul{margin:0 0 12px;padding-left:18px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
details.more li b{color:var(--ink);font-weight:600}
.metas{display:flex;flex-direction:column;gap:8px;margin:0;padding-left:18px;font-size:14px}
/* Mês (dashboard mensal) */
.tabs .inner{grid-template-columns:repeat(7,auto)!important}
.tabs button{font-size:12px;padding:9px 5px}
.mseg{display:flex;gap:2px;background:var(--sunk);padding:4px;border-radius:99px;overflow-x:auto;scrollbar-width:none}
.mseg button{flex:1;padding:8px 6px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.mseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.g-treino{--c:var(--move)} .g-mestrado{--c:var(--med)} .g-logos{--c:var(--read)} .g-none{--c:var(--other)}
.blk{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.blk .check{width:30px;height:30px}
.blk .check:disabled{opacity:.35;cursor:default}
.blk.done .check{background:var(--c)} .blk.done .check svg{opacity:1}
.blk.done .hname,.blk.done input{color:var(--muted);text-decoration:line-through}
.blk.fixed .hname{color:var(--muted);font-weight:500}
.blk .tm{font-size:12.5px;color:var(--muted);font-weight:600}
.blk input{font:inherit;font-weight:600;border:0;background:transparent;color:var(--ink);padding:6px 0;width:100%;min-width:0;outline:0}
.fixdot{width:30px;height:30px;display:grid;place-items:center} .fixdot i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.plus{font-size:12px;font-weight:700;color:var(--c);white-space:nowrap}
.badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;align-self:start}
.badge.ok{background:color-mix(in srgb,var(--diet) 16%,var(--surface));color:var(--diet)}
.badge.late{background:color-mix(in srgb,var(--move) 16%,var(--surface));color:var(--move)}
.badge.hit{background:var(--accent);color:var(--accent-ink)}
.gbar{position:relative;height:10px;border-radius:5px;background:var(--sunk);margin:4px 0}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--c)}
.gbar b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.gsum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.gsum:first-child{border-top:0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3>div{background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats3 b{font-family:var(--f-display);font-size:17px;color:var(--c)}
.stats3 span{font-size:11.5px;color:var(--muted)}
.wday{padding:11px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;text-align:left;width:100%}
.wday:first-child{border-top:0}
.wday.today{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.wday .hname{display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.bchip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.bchip.done{background:var(--c);color:var(--surface)}
.bchip.fixed{background:var(--sunk);color:var(--muted)}
.mta{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:72px;resize:vertical}
.mta[readonly]{font-size:13px!important;color:var(--muted);min-height:200px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app">
  <div class="top"><span class="brand">Meus Hábitos</span><span style="display:flex;align-items:center;gap:10px"><span class="mode" id="mode">Carregando…</span><button class="chip" id="bkbtn" data-act="menu" hidden style="font-size:13px;padding:7px 14px">Backup</button></span></div>
<input type="file" id="filein" accept=".json,application/json,text/plain" hidden>
  <div id="view"><p class="note">Carregando seus hábitos…</p></div>
</div>

<script>
/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const today=()=>ds(new Date());
const weekStart=s=>{const d=pd(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ds(d)};
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
const DOW1=['S','T','Q','Q','S','S','D'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const niceDay=s=>{const d=pd(s);const t=today();if(s===t)return'Hoje';if(s===addD(t,-1))return'Ontem';
  const w=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][d.getDay()];return w+', '+d.getDate()+' '+MES[d.getMonth()].slice(0,3)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- state ---------- */
const S={tasks:[],newPri:'importante',showDone:false,books:[],settings:{booksPerMonth:1},habits:[],logs:{},view:'hoje',day:today(),month:today().slice(0,7),loaded:false,local:false,editing:null};
const CATS=[['dieta','Alimentação'],['movimento','Movimento'],['medico','Estudos médicos'],['pessoal','Estudos pessoais'],['leitura','Leitura'],['outro','Outros']];

/* ---------- store ---------- */
let db=null;const queues={};
function enqueue(key,fn){const p=(queues[key]||Promise.resolve()).then(fn,fn);queues[key]=p.catch(()=>{});return p}
const LS='meus-habitos.v1';
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS))||{habits:{},logs:{}}}catch(e){return{habits:{},logs:{}}}}
function lsSave(){try{const h={};S.habits.forEach(x=>h[x.id]=x);const b={};S.books.forEach(x=>b[x.id]=x);const tk={};S.tasks.forEach(x=>tk[x.id]=x);localStorage.setItem(LS,JSON.stringify({habits:h,logs:S.logs,books:b,tasks:tk,settings:S.settings}))}catch(e){}}

function getVal(date,hid){const m=S.logs[date.slice(0,7)];return m&&m.d&&m.d[date]?m.d[date][hid]:undefined}
function isDone(h,date){const v=getVal(date,h.id);return h.kind==='count'?(Number(v)||0)>=(h.goal||1):!!v}

async function setLog(date,hid,val){
  const m=date.slice(0,7);
  const cur=S.logs[m]?structuredClone(S.logs[m]):{d:{}};
  cur.d=cur.d||{};cur.d[date]={...(cur.d[date]||{}),[hid]:val};S.logs={...S.logs,[m]:cur};render();
  if(!db){lsSave();return}
  enqueue('logs/'+m,async()=>{const ref=db.doc('logs/'+m);const snap=await ref.get();
    const body={d:{[date]:{[hid]:val}}};
    if(snap.exists)await ref.update(body);else await ref.set(body);
  }).catch(e=>toast(errMsg(e)));
}
async function saveHabit(h){
  const i=S.habits.findIndex(x=>x.id===h.id);const arr=[...S.habits];if(i>=0)arr[i]=h;else arr.push(h);
  S.habits=arr.sort((a,b)=>(a.order||0)-(b.order||0));render();
  if(!db){lsSave();return}
  enqueue('habits/'+h.id,()=>db.doc('habits/'+h.id).set(h)).catch(e=>toast(errMsg(e)));
}
async function removeHabit(id){
  S.habits=S.habits.filter(x=>x.id!==id);render();
  if(!db){lsSave();return}
  enqueue('habits/'+id,()=>db.doc('habits/'+id).delete()).catch(e=>toast(errMsg(e)));
}
async function saveBook(b){const i=S.books.findIndex(x=>x.id===b.id);const arr=[...S.books];if(i>=0)arr[i]=b;else arr.push(b);S.books=arr;render();
  if(!db){lsSave();return}enqueue('books/'+b.id,()=>db.doc('books/'+b.id).set(b)).catch(e=>toast(errMsg(e)))}
async function removeBook(id){S.books=S.books.filter(x=>x.id!==id);render();if(!db){lsSave();return}
  enqueue('books/'+id,()=>db.doc('books/'+id).delete()).catch(e=>toast(errMsg(e)))}
async function saveTask(t){const i=S.tasks.findIndex(x=>x.id===t.id);const arr=[...S.tasks];if(i>=0)arr[i]=t;else arr.push(t);S.tasks=arr;render();
  if(!db){lsSave();return}enqueue('tasks/'+t.id,()=>db.doc('tasks/'+t.id).set(t)).catch(e=>toast(errMsg(e)))}
async function removeTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);render();if(!db){lsSave();return}
  enqueue('tasks/'+id,()=>db.doc('tasks/'+id).delete()).catch(e=>toast(errMsg(e)))}
async function saveSettings(){render();if(!db){lsSave();return}enqueue('settings/main',()=>db.doc('settings/main').set({...S.settings})).catch(e=>toast(errMsg(e)))}
function errMsg(e){if(e&&e.code==='invalid_argument')return'Você não tem permissão para editar esta página.';
  if(e&&e.code==='quota_exceeded')return'Limite de armazenamento atingido. Exclua hábitos antigos.';return'Não consegui salvar agora. Tente de novo em instantes.'}

const STARTERS=[
  {name:'Beber água',cat:'dieta',kind:'count',goal:8,unit:'copos',freq:7},
  {name:'Verdura no almoço e no jantar',cat:'dieta',kind:'check',freq:7},
  {name:'Sem doce ou ultraprocessado',cat:'dieta',kind:'check',freq:7},
  {name:'Cardio (corrida)',cat:'movimento',kind:'check',freq:4},
  {name:'Musculação',cat:'movimento',kind:'check',freq:4},
  {name:'Passos',cat:'movimento',kind:'count',goal:8000,unit:'passos',freq:7},
  {name:'Dormir 7 h ou mais',cat:'outro',kind:'check',freq:7},
];
function addStarters(){STARTERS.forEach((s,i)=>saveHabit({...s,id:uid()+i,order:i+1,createdAt:today()}));toast('Sugestões adicionadas. Toque no nome para editar.')}

/* ---------- metrics ---------- */
const existsOn=(h,d)=>!h.createdAt||h.createdAt<=d;
function weekCount(h,ws,upto){let c=0;for(let i=0;i<7;i++){const d=addD(ws,i);if(upto&&d>upto)break;if(isDone(h,d))c++}return c}
function dayPct(d){let den=0,num=0;S.habits.forEach(h=>{if(!existsOn(h,d))return;const done=isDone(h,d);
  if((h.freq||7)>=7){den++;if(done)num++}else if(done){den++;num++}});return den?num/den:null}
function streak(h){const t=today();
  if((h.freq||7)>=7){let d=t,c=0;if(!isDone(h,d))d=addD(d,-1);while(c<999&&isDone(h,d)){c++;d=addD(d,-1)}return{n:c,u:c===1?'dia seguido':'dias seguidos'}}
  let ws=weekStart(t),c=0;if(weekCount(h,ws)<h.freq)ws=addD(ws,-7);
  while(c<200&&weekCount(h,ws)>=h.freq){c++;ws=addD(ws,-7)}return{n:c,u:c===1?'semana seguida':'semanas seguidas'}}
function rate30(h){const t=today();
  if((h.freq||7)>=7){let den=0,num=0;for(let i=0;i<30;i++){const d=addD(t,-i);if(!existsOn(h,d))break;den++;if(isDone(h,d))num++}return den?num/den:null}
  let num=0;for(let i=0;i<28;i++)if(isDone(h,addD(t,-i)))num++;return Math.min(1,num/(h.freq*4))}

/* ---------- render ---------- */
const $=s=>document.querySelector(s);
const CHECK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--surface)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ARW=(dir)=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${dir<0?'M15 5l-7 7 7 7':'M9 5l7 7-7 7'}"/></svg>`;

function render(){
  $('#mode').textContent=!S.loaded?'Carregando…':S.local?'Salvo neste celular':'Sincronizado';
  $('#bkbtn').hidden=!(S.loaded&&S.local);
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.view)));
  const af=document.activeElement&&document.activeElement.id;
  $('#view').innerHTML=!S.loaded?'<p class="note">Carregando seus hábitos…</p>':S.view==='hoje'?viewDay():S.view==='mes'?viewMes():S.view==='dieta'?viewDiet():S.view==='treino'?viewTreino():S.view==='livros'?viewBooks():S.view==='tarefas'?viewTasks():viewHist();
  const q=$('#q-title');if(q){q.value=S.quickDraft||'';if(af==='q-title')q.focus()}
  if(!S.editing)renderSheet();
}

function viewDay(){
  const d=S.day,t=today();
  if(S.local&&!S.habits.length)return `<div class="empty"><h2>Entre para ver seus hábitos</h2>
    <p>Seus hábitos, livros e tarefas ficam salvos na sua conta Claude. Toque em <strong>Entrar</strong>, no topo da página, e faça login. Depois disso, o Safari guarda o acesso.</p></div>`;
  if(!S.habits.length)return `<div class="empty"><h2>Comece com poucos hábitos</h2>
    <p>Marque cada hábito todos os dias. Você vê a sequência, a semana e o mês. Comece com 3 a 6 hábitos que você consegue cumprir mesmo em dia de plantão.</p>
    <div class="row"><button class="addbtn" data-act="new">+ Criar hábito</button><button class="ghost" data-act="starters">Usar sugestões</button></div></div>`;
  const hs=S.habits.filter(h=>existsOn(h,d));
  const daily=hs.filter(h=>(h.freq||7)>=7);const doneDaily=daily.filter(h=>isDone(h,d)).length;
  const pct=dayPct(d);const P=pct==null?0:pct;
  const C=2*Math.PI*34;
  const ws=weekStart(d);
  let week='';for(let i=0;i<7;i++){const x=addD(ws,i);const p=x>t?null:dayPct(x);
    week+=`<button class="wd ${x===d?'sel':''} ${x>t?'future':''}" ${x>t?'disabled':''} data-day="${x}" aria-label="${niceDay(x)}"><span class="dot"><i style="height:${Math.round((p||0)*100)}%"></i></span>${DOW1[i]}</button>`}
  const left=daily.length-doneDaily;
  const msg=!daily.length?'Seus hábitos são semanais. Marque quando fizer.':left===0?'<strong>Tudo feito.</strong> Dia completo.':`<strong>${left} ${left===1?'hábito diário falta':'hábitos diários faltam'}</strong>${d===t?' hoje':''}.`;
  let groups='';
  CATS.forEach(([k,label])=>{const list=hs.filter(h=>h.cat===k);if(!list.length)return;
    groups+=`<section class="group"><div class="ghead"><span class="sw cat-${k}" style="background:var(--c)"></span><span class="eyebrow">${label}</span></div><div class="list">${list.map(h=>habitRow(h,d)).join('')}</div></section>`});
  return `<div class="wrap" style="padding:0">
    <div class="daynav"><button class="iconbtn" data-nav="-1" aria-label="Dia anterior">${ARW(-1)}</button><h1>${niceDay(d)}</h1>
      ${d!==t?'<button class="chip link" data-act="gotoday">Ir para hoje</button>':''}
      <button class="iconbtn" data-nav="1" aria-label="Próximo dia" ${d>=t?'disabled':''}>${ARW(1)}</button></div>
    <div class="summary">
      <svg class="ring" width="88" height="88" viewBox="0 0 88 88" role="img" aria-label="${Math.round(P*100)}% concluído">
        <circle cx="44" cy="44" r="34" fill="none" stroke="var(--sunk)" stroke-width="9"/>
        <circle cx="44" cy="44" r="34" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(C*P).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 44 44)"/>
        <text x="44" y="50" text-anchor="middle" font-size="19">${Math.round(P*100)}%</text></svg>
      <div class="sumtext"><p>${msg}</p><div class="week">${week}</div></div>
    </div>
    ${groups}
    <button class="addbtn" data-act="new">+ Novo hábito</button>
  </div>`;
}
function habitRow(h,d){
  const done=isDone(h,d);const st=streak(h);const v=Number(getVal(d,h.id))||0;
  const weekly=(h.freq||7)<7;const wc=weekly?weekCount(h,weekStart(d)):0;
  const meta=[];
  if(st.n>0)meta.push(`<span class="streak">${st.n} ${st.u}</span>`);
  if(weekly)meta.push(`${wc} de ${h.freq} nesta semana`);
  if(h.kind==='count')meta.push(`meta ${fmt(h.goal)} ${esc(h.unit||'')}`);
  if(!meta.length)meta.push(weekly?'':'todo dia');
  const main=`<button class="hinfo" data-edit="${h.id}"><span class="hname">${esc(h.name)}</span><span class="hmeta">${meta.join('')?meta.map(m=>`<span>${m}</span>`).join(''):''}</span></button>`;
  if(h.kind==='count'){
    const step=stepOf(h);
    return `<div class="habit cat-${h.cat} ${done?'done':''}">
      <button class="check" data-toggle="${h.id}" aria-label="Marcar meta de ${esc(h.name)}" aria-pressed="${done}">${CHECK}</button>${main}
      <div class="stepper"><button data-inc="${h.id}" data-by="${-step}" aria-label="Diminuir">−</button><span class="val">${fmt(v)}</span><button data-inc="${h.id}" data-by="${step}" aria-label="Aumentar">+</button></div>
      <div class="bar"><i style="width:${Math.min(100,Math.round(v/(h.goal||1)*100))}%"></i></div></div>`}
  return `<div class="habit cat-${h.cat} ${done?'done':''}"><button class="check" data-toggle="${h.id}" aria-label="Marcar ${esc(h.name)}" aria-pressed="${done}">${CHECK}</button>${main}<span></span></div>`;
}

const mealHabit=p=>S.habits.find(h=>h.id===p.id)||{id:p.id,kind:'check'};
function viewDiet(){
  const d=S.day,t=today();
  const done=PLAN.filter(p=>isDone(mealHabit(p),d)).length;
  const cards=PLAN.map(p=>{const h=mealHabit(p);const v=getVal(d,p.id);const ok=isDone(h,d);
    const opts=p.opts.map((o,i)=>`<button class="opt ${v===o.n?'sel':''}" data-meal="${p.id}" data-opt="${i}"><span class="radio"></span><span><span class="oname">${p.opts.length>1?'Opção '+(i+1)+' · ':''}${esc(o.n)}</span><span class="oitems">${o.i}</span></span></button>`).join('');
    return `<section class="meal ${ok?'done':''}"><div class="mhd"><button class="check" data-mealcheck="${p.id}" aria-pressed="${ok}" aria-label="Marcar ${p.title}">${CHECK}</button>
      <div><span class="time">${p.time}</span><h3>${p.title}</h3><span class="sub">${ok?(typeof v==='string'?'Feito · '+esc(v):'Feito'):(p.opts.length>1?'Toque na opção que você comeu':'Toque para marcar')}</span></div></div>
      <div class="opts">${opts}</div>
      <details class="more" data-k="s-${p.id}" ${S.open&&S.open['s-'+p.id]?'open':''}><summary>Substituições</summary><ul>${p.subs.map(s=>`<li>${s}</li>`).join('')}</ul></details></section>`}).join('');
  return `<div class="wrap" style="padding:0">
    <div class="daynav"><button class="iconbtn" data-nav="-1" aria-label="Dia anterior">${ARW(-1)}</button><h1>${niceDay(d)}</h1>
      ${d!==t?'<button class="chip link" data-act="gotoday">Ir para hoje</button>':''}
      <button class="iconbtn" data-nav="1" aria-label="Próximo dia" ${d>=t?'disabled':''}>${ARW(1)}</button></div>
    <p class="note" style="font-size:14px"><strong style="color:var(--ink)">${done} de ${PLAN.length} refeições</strong> no plano ${d===t?'hoje':'neste dia'}.</p>
    ${cards}
    <div class="card"><h2 style="font-size:19px">Metas</h2><ul class="metas">${METAS.map(m=>`<li>${m}</li>`).join('')}</ul></div>
  </div>`;
}

function migrateLocal(){let ch=false;const has=id=>S.habits.some(h=>h.id===id);

function useLocal(){S.local=true;let first=false;try{first=!localStorage.getItem(LS)}catch(e){}

  const L=lsLoad();S.habits=Object.values(L.habits||{}).sort((a,b)=>(a.order||0)-(b.order||0));S.logs=L.logs||{};S.books=Object.values(L.books||{});S.tasks=Object.values(L.tasks||{});S.settings={booksPerMonth:1,...(L.settings||{})};migrateLocal();S.loaded=true;render()}

(async()=>{
  let api=null;try{api=window.claude&&await window.claude.use('db')}catch(e){api=null}
  if(!api){useLocal();return}
  db=api;let got={h:false,l:false,b:false,t:false};
  const done=()=>{if(got.h&&got.l&&got.b&&got.t){S.loaded=true;render()}};
  const onErr=e=>{if(!S.loaded){db=null;useLocal()}else toast('Conexão perdida. Recarregue a página.')};
  db.collection('habits').onSnapshot(s=>{S.habits=s.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.order||0)-(b.order||0));got.h=true;S.loaded?render():done()},onErr);
  db.collection('tasks').onSnapshot(s=>{S.tasks=s.docs.map(d=>({...d.data(),id:d.id}));got.t=true;S.loaded?render():done()},onErr);
  db.collection('books').onSnapshot(s=>{S.books=s.docs.map(d=>({...d.data(),id:d.id}));got.b=true;S.loaded?render():done()},onErr);
  db.doc('settings/main').onSnapshot(s=>{if(s.exists){S.settings={booksPerMonth:1,...s.data()};if(S.loaded)render()}},()=>{});
  db.collection('logs').onSnapshot(s=>{const L={};s.docs.forEach(d=>L[d.id]=d.data());S.logs=L;got.l=true;S.loaded?render():done()},onErr);
})();
