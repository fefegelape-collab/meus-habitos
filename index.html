<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Hábitos">

<title>Meus Hábitos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: single mobile column (max 560px), day header + ring summary, habit rows grouped by category, fixed bottom tab bar */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --sunk:#E2E8E4; --ink:#14251E; --muted:#5B6D65; --line:#D3DCD7;
  --accent:#2F54D6; --accent-ink:#FFFFFF;
  --diet:#2B8A55; --move:#DB5A2A; --med:#1F6FB2; --self:#B8497A; --read:#A06D0C; --other:#7657D2;
  --danger:#C23A3A;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1613; --surface:#16211C; --sunk:#1E2A25; --ink:#E4EDE8; --muted:#92A49B; --line:#2A3831;
  --accent:#8199FF; --accent-ink:#0E1613; --diet:#5AC98A; --move:#FF8C5E; --med:#6CB4F0; --self:#F08AB8; --read:#E6B454; --other:#B19BFF; --danger:#FF7A7A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1613; --surface:#16211C; --sunk:#1E2A25; --ink:#E4EDE8; --muted:#92A49B; --line:#2A3831;
  --accent:#8199FF; --accent-ink:#0E1613; --diet:#5AC98A; --move:#FF8C5E; --med:#6CB4F0; --self:#F08AB8; --read:#E6B454; --other:#B19BFF; --danger:#FF7A7A; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 96px;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-top:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:15px;letter-spacing:-.01em}
.mode{font-size:12px;color:var(--muted)}
.daynav{display:flex;align-items:center;gap:6px}
.daynav h1{font-size:clamp(26px,7vw,34px);font-weight:800;letter-spacing:-.02em;line-height:1.05;flex:1;min-width:0}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn:disabled{opacity:.35;cursor:default}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.chip.link{color:var(--accent)}

/* Summary */
.summary{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.ring text{font-family:var(--f-display);font-weight:800;fill:var(--ink)}
.sumtext{display:flex;flex-direction:column;gap:10px;min-width:0}
.sumtext p{margin:0;color:var(--muted);font-size:14px}
.sumtext strong{color:var(--ink)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:2px 0;border-radius:8px}
.wd .dot{width:22px;height:22px;border-radius:50%;background:var(--sunk);position:relative;overflow:hidden}
.wd .dot i{position:absolute;inset:auto 0 0 0;background:var(--accent)}
.wd.sel{color:var(--ink);font-weight:700}
.wd.sel .dot{outline:2px solid var(--ink);outline-offset:1px}
.wd.future{opacity:.35;cursor:default}

/* Groups & habits */
.group{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;align-items:center;gap:8px}
.ghead .sw{width:8px;height:8px;border-radius:2px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.habit{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.habit:first-child{border-top:0}
.check{width:34px;height:34px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;transition:background .15s}
.check svg{opacity:0;transition:opacity .15s}
.habit.done .check{background:var(--c)}
.habit.done .check svg{opacity:1}
.hinfo{min-width:0;text-align:left;display:flex;flex-direction:column;gap:2px;padding:0}
.hname{font-weight:600;overflow-wrap:anywhere}
.habit.done .hname{color:var(--muted)}
.hmeta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.hmeta .streak{color:var(--c);font-weight:600}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:30px;height:30px;border-radius:50%;background:var(--sunk);font-size:18px;line-height:1;display:grid;place-items:center}
.stepper .val{min-width:44px;text-align:center;font-weight:700;font-size:14px}
.bar{height:4px;border-radius:2px;background:var(--sunk);grid-column:2 / 4;margin-top:-4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.cat-dieta{--c:var(--diet)} .cat-movimento{--c:var(--move)} .cat-medico{--c:var(--med)} .cat-pessoal{--c:var(--self)} .cat-leitura{--c:var(--read)} .cat-outro{--c:var(--other)}

.addbtn{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:99px;background:var(--ink);color:var(--bg);font-weight:600}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:12px}
.empty p{margin:0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.ghost{padding:10px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:600}

/* History */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mhead h2{font-size:20px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:600}
.cell{aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--sunk);font-size:12px;display:flex;align-items:flex-start;justify-content:flex-start;padding:4px 5px;position:relative;color:var(--ink)}
.cell.lv1{background:color-mix(in srgb,var(--accent) 22%,var(--sunk))}
.cell.lv2{background:color-mix(in srgb,var(--accent) 48%,var(--sunk))}
.cell.lv3{background:color-mix(in srgb,var(--accent) 75%,var(--sunk));color:var(--accent-ink)}
.cell.lv4{background:var(--accent);color:var(--accent-ink);font-weight:700}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell.future{opacity:.35;cursor:default}
.legend{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.legend span{width:12px;height:12px;border-radius:3px;display:inline-block}
.hstat{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding-top:12px;border-top:1px solid var(--line)}
.hstat:first-of-type{border-top:0;padding-top:0}
.hstat .pct{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--c);text-align:right}
.strip{grid-column:1 / -1;display:grid;grid-template-columns:repeat(28,1fr);gap:2px}
.strip i{height:14px;border-radius:2px;background:var(--sunk)}
.strip i.on{background:var(--c)}
.strip i.part{background:color-mix(in srgb,var(--c) 40%,var(--sunk))}
.note{font-size:12.5px;color:var(--muted);margin:0}

/* Books */
.goalrow{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.big{font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1;letter-spacing:-.02em}
.big small{font-size:15px;color:var(--muted);font-weight:600;letter-spacing:0}
.pbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--read)}
.book{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.book:first-child{border-top:0}
.spine{width:30px;height:40px;border-radius:4px;background:var(--read);display:grid;place-items:center;color:var(--surface)}
.spine.audio{border-radius:50%;width:36px;height:36px}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.mini{padding:7px 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap}
/* Tasks */
.pri-urgente{--c:var(--danger)} .pri-importante{--c:var(--move)} .pri-necessario{--c:var(--med)}
.quick{display:flex;flex-direction:column;gap:10px}
.quick .in{display:flex;gap:8px}
.quick input{flex:1;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.quick .primary{padding:10px 16px}
.seg.pri button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:var(--surface)}
.task{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .check{width:28px;height:28px;border-radius:8px}
.task.done .check{background:var(--c)} .task.done .check svg{opacity:1}
.task.done .hname{text-decoration:line-through;color:var(--muted)}
.due.late{color:var(--danger);font-weight:600}
.count{font-family:var(--f-display);font-weight:800;color:var(--c)}
/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:5}
.tabs .inner{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;max-width:560px;background:var(--sunk);padding:4px;border-radius:99px}
.tabs button{padding:9px 4px;font-size:14px;border-radius:99px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgb(8 14 12 / .45);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:0 8px}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;max-height:92%;overflow:auto}
.sheet h2{font-size:22px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field input{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{padding:8px 14px;border-radius:99px;border:1px solid var(--line);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline .field{flex:1;min-width:120px}
.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;align-items:center}
.primary{padding:11px 20px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.danger{color:var(--danger);font-weight:600;padding:10px 4px}
.danger.armed{background:var(--danger);color:var(--surface);padding:10px 16px;border-radius:99px}
.err{color:var(--danger);font-size:13px;margin:0}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
/* Dieta */
.tabs{padding-inline:10px!important}
.tabs .inner{grid-template-columns:repeat(6,auto)!important;gap:0;justify-content:space-between}
.tabs button{font-size:12.5px;padding:9px 7px;white-space:nowrap}
.meal.move{--c:var(--move)}
.wk{display:flex;gap:4px;align-items:center}
.wk i{width:10px;height:10px;border-radius:50%;background:var(--sunk);display:block}
.wk i.on{background:var(--c)}
.ex{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 14px;border-top:1px solid var(--line);font-size:14px}
.ex:first-child{border-top:0}
.ex .sr{font-weight:700;white-space:nowrap;text-align:right}
.ex .ld{font-size:12.5px;color:var(--muted)}
.sslabel{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--c);padding:12px 14px 4px;border-top:1px solid var(--line)}
.next{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--c);color:var(--surface);margin-left:6px;vertical-align:1px}
.zones{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin:0 0 12px}
.zones b{color:var(--ink)}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;--c:var(--diet)}
.mhd{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:14px}
.mhd .time{font-family:var(--f-display);font-weight:800;font-size:13px;color:var(--c);letter-spacing:.02em}
.mhd h3{font-size:19px;font-weight:800;letter-spacing:-.01em}
.mhd .sub{font-size:12.5px;color:var(--muted)}
.meal.done .check{background:var(--c)} .meal.done .check svg{opacity:1}
.opts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.opt{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:12px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.opt:first-child{border-top:0}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center}
.opt.sel{background:color-mix(in srgb,var(--c) 9%,var(--surface))}
.opt.sel .radio{border-color:var(--c);background:var(--c)}
.opt.sel .radio::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--surface)}
.oname{font-weight:700;display:block}
.oitems{font-size:13.5px;color:var(--muted);display:block;margin-top:2px}
.oitems b{color:var(--ink);font-weight:600}
details.more{border-top:1px solid var(--line);padding:0 14px}
details.more summary{cursor:pointer;padding:11px 0;font-size:13px;font-weight:600;color:var(--c);list-style:none}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+ "}
details.more[open] summary::before{content:"− "}
details.more ul{margin:0 0 12px;padding-left:18px;font-size:13.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
details.more li b{color:var(--ink);font-weight:600}
.metas{display:flex;flex-direction:column;gap:8px;margin:0;padding-left:18px;font-size:14px}
/* Mês (dashboard mensal) */
.tabs .inner{grid-template-columns:repeat(7,auto)!important}
.tabs button{font-size:12px;padding:9px 5px}
.mseg{display:flex;gap:2px;background:var(--sunk);padding:4px;border-radius:99px;overflow-x:auto;scrollbar-width:none}
.mseg button{flex:1;padding:8px 6px;border-radius:99px;font-size:13px;font-weight:600;color:var(--muted);white-space:nowrap}
.mseg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.g-treino{--c:var(--move)} .g-mestrado{--c:var(--med)} .g-logos{--c:var(--read)} .g-none{--c:var(--other)}
.blk{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.blk .check{width:30px;height:30px}
.blk .check:disabled{opacity:.35;cursor:default}
.blk.done .check{background:var(--c)} .blk.done .check svg{opacity:1}
.blk.done .hname,.blk.done input{color:var(--muted);text-decoration:line-through}
.blk.fixed .hname{color:var(--muted);font-weight:500}
.blk .tm{font-size:12.5px;color:var(--muted);font-weight:600}
.blk input{font:inherit;font-weight:600;border:0;background:transparent;color:var(--ink);padding:6px 0;width:100%;min-width:0;outline:0}
.fixdot{width:30px;height:30px;display:grid;place-items:center} .fixdot i{width:8px;height:8px;border-radius:2px;background:var(--line)}
.plus{font-size:12px;font-weight:700;color:var(--c);white-space:nowrap}
.badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;align-self:start}
.badge.ok{background:color-mix(in srgb,var(--diet) 16%,var(--surface));color:var(--diet)}
.badge.late{background:color-mix(in srgb,var(--move) 16%,var(--surface));color:var(--move)}
.badge.hit{background:var(--accent);color:var(--accent-ink)}
.gbar{position:relative;height:10px;border-radius:5px;background:var(--sunk);margin:4px 0}
.gbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--c)}
.gbar b{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--ink);border-radius:2px}
.gsum{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.gsum:first-child{border-top:0}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats3>div{background:var(--sunk);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stats3 b{font-family:var(--f-display);font-size:17px;color:var(--c)}
.stats3 span{font-size:11.5px;color:var(--muted)}
.wday{padding:11px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:7px;text-align:left;width:100%}
.wday:first-child{border-top:0}
.wday.today{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.wday .hname{display:flex;justify-content:space-between;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.bchip{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--c)}
.bchip.done{background:var(--c);color:var(--surface)}
.bchip.fixed{background:var(--sunk);color:var(--muted)}
.mta{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-height:72px;resize:vertical}
.mta[readonly]{font-size:13px!important;color:var(--muted);min-height:200px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* Projeto: calorias e metas */
.tabs .inner{display:flex!important;overflow-x:auto;scrollbar-width:none;justify-content:flex-start!important;gap:2px!important;-webkit-overflow-scrolling:touch}
.tabs .inner::-webkit-scrollbar{display:none}
.tabs button{flex:none!important;padding:9px 12px!important;font-size:13px!important}
.pbal{gap:10px}
.pbrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pst{background:var(--sunk);border-radius:10px;padding:9px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.pst span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}

</div></nav>

<script>
/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const today=()=>ds(new Date());
const weekStart=s=>{const d=pd(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ds(d)};
const DOW=['dom','seg','ter','qua','qui','sex','sáb'];
const DOW1=['S','T','Q','Q','S','S','D'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const niceDay=s=>{const d=pd(s);const t=today();if(s===t)return'Hoje';if(s===addD(t,-1))return'Ontem';
  const w=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][d.getDay()];return w+', '+d.getDate()+' '+MES[d.getMonth()].slice(0,3)};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- state ---------- */
const S={tasks:[],newPri:'importante',showDone:false,books:[],settings:{booksPerMonth:1},habits:[],logs:{},view:'hoje',day:today(),month:today().slice(0,7),loaded:false,local:false,editing:null};
const CATS=[['dieta','Alimentação'],['movimento','Movimento'],['medico','Estudos médicos'],['pessoal','Estudos pessoais'],['leitura','Leitura'],['outro','Outros']];

/* ---------- store ---------- */
let db=null;const queues={};
function enqueue(key,fn){const p=(queues[key]||Promise.resolve()).then(fn,fn);queues[key]=p.catch(()=>{});return p}
const LS='meus-habitos.v1';
function lsLoad(){try{return JSON.parse(localStorage.getItem(LS))||{habits:{},logs:{}}}catch(e){return{habits:{},logs:{}}}}
function lsSave(){try{const h={};S.habits.forEach(x=>h[x.id]=x);const b={};S.books.forEach(x=>b[x.id]=x);const tk={};S.tasks.forEach(x=>tk[x.id]=x);localStorage.setItem(LS,JSON.stringify({habits:h,logs:S.logs,books:b,tasks:tk,settings:S.settings}))}catch(e){}}

function getVal(date,hid){const m=S.logs[date.slice(0,7)];return m&&m.d&&m.d[date]?m.d[date][hid]:undefined}
function isDone(h,date){const v=getVal(date,h.id);return h.kind==='count'?(Number(v)||0)>=(h.goal||1):!!v}

async function setLog(date,hid,val){
  const m=date.slice(0,7);
  const cur=S.logs[m]?structuredClone(S.logs[m]):{d:{}};
  cur.d=cur.d||{};cur.d[date]={...(cur.d[date]||{}),[hid]:val};S.logs={...S.logs,[m]:cur};render();
  if(!db){lsSave();return}
  enqueue('logs/'+m,async()=>{const ref=db.doc('logs/'+m);const snap=await ref.get();
    const body={d:{[date]:{[hid]:val}}};
    if(snap.exists)await ref.update(body);else await ref.set(body);
  }).catch(e=>toast(errMsg(e)));
}
async function saveHabit(h){
  const i=S.habits.findIndex(x=>x.id===h.id);const arr=[...S.habits];if(i>=0)arr[i]=h;else arr.push(h);
  S.habits=arr.sort((a,b)=>(a.order||0)-(b.order||0));render();
  if(!db){lsSave();return}
  enqueue('habits/'+h.id,()=>db.doc('habits/'+h.id).set(h)).catch(e=>toast(errMsg(e)));
}
async function removeHabit(id){
  S.habits=S.habits.filter(x=>x.id!==id);render();
  if(!db){lsSave();return}
  enqueue('habits/'+id,()=>db.doc('habits/'+id).delete()).catch(e=>toast(errMsg(e)));
}
async function saveBook(b){const i=S.books.findIndex(x=>x.id===b.id);const arr=[...S.books];if(i>=0)arr[i]=b;else arr.push(b);S.books=arr;render();
  if(!db){lsSave();return}enqueue('books/'+b.id,()=>db.doc('books/'+b.id).set(b)).catch(e=>toast(errMsg(e)))}
async function removeBook(id){S.books=S.books.filter(x=>x.id!==id);render();if(!db){lsSave();return}
  enqueue('books/'+id,()=>db.doc('books/'+id).delete()).catch(e=>toast(errMsg(e)))}
async function saveTask(t){const i=S.tasks.findIndex(x=>x.id===t.id);const arr=[...S.tasks];if(i>=0)arr[i]=t;else arr.push(t);S.tasks=arr;render();
  if(!db){lsSave();return}enqueue('tasks/'+t.id,()=>db.doc('tasks/'+t.id).set(t)).catch(e=>toast(errMsg(e)))}
async function removeTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);render();if(!db){lsSave();return}
  enqueue('tasks/'+id,()=>db.doc('tasks/'+id).delete()).catch(e=>toast(errMsg(e)))}
async function saveSettings(){render();if(!db){lsSave();return}enqueue('settings/main',()=>db.doc('settings/main').set({...S.settings})).catch(e=>toast(errMsg(e)))}
function errMsg(e){if(e&&e.code==='invalid_argument')return'Você não tem permissão para editar esta página.';
  if(e&&e.code==='quota_exceeded')return'Limite de armazenamento atingido. Exclua hábitos antigos.';return'Não consegui salvar agora. Tente de novo em instantes.'}

const STARTERS=[
  {name:'Beber água',cat:'dieta',kind:'count',goal:8,unit:'copos',freq:7},
  {name:'Verdura no almoço e no jantar',cat:'dieta',kind:'check',freq:7},
  {name:'Sem doce ou ultraprocessado',cat:'dieta',kind:'check',freq:7},
  {name:'Cardio (corrida)',cat:'movimento',kind:'check',freq:4},
  {name:'Musculação',cat:'movimento',kind:'check',freq:4},
  {name:'Passos',cat:'movimento',kind:'count',goal:8000,unit:'passos',freq:7},
  {name:'Dormir 7 h ou mais',cat:'outro',kind:'check',freq:7},
];
function addStarters(){STARTERS.forEach((s,i)=>saveHabit({...s,id:uid()+i,order:i+1,createdAt:today()}));toast('Sugestões adicionadas. Toque no nome para editar.')}

/* ---------- metrics ---------- */
const existsOn=(h,d)=>!h.createdAt||h.createdAt<=d;
function weekCount(h,ws,upto){let c=0;for(let i=0;i<7;i++){const d=addD(ws,i);if(upto&&d>upto)break;if(isDone(h,d))c++}return c}
function dayPct(d){let den=0,num=0;S.habits.forEach(h=>{if(!existsOn(h,d))return;const done=isDone(h,d);
  if((h.freq||7)>=7){den++;if(done)num++}else if(done){den++;num++}});return den?num/den:null}
function streak(h){const t=today();
  if((h.freq||7)>=7){let d=t,c=0;if(!isDone(h,d))d=addD(d,-1);while(c<999&&isDone(h,d)){c++;d=addD(d,-1)}return{n:c,u:c===1?'dia seguido':'dias seguidos'}}
  let ws=weekStart(t),c=0;if(weekCount(h,ws)<h.freq)ws=addD(ws,-7);
  while(c<200&&weekCount(h,ws)>=h.freq){c++;ws=addD(ws,-7)}return{n:c,u:c===1?'semana seguida':'semanas seguidas'}}
function rate30(h){const t=today();
  if((h.freq||7)>=7){let den=0,num=0;for(let i=0;i<30;i++){const d=addD(t,-i);if(!existsOn(h,d))break;den++;if(isDone(h,d))num++}return den?num/den:null}
  let num=0;for(let i=0;i<28;i++)if(isDone(h,addD(t,-i)))num++;return Math.min(1,num/(h.freq*4))}

/* ---------- render ---------- */
const $=s=>document.querySelector(s);
const CHECK='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--surface)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const ARW=(dir)=>`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${dir<0?'M15 5l-7 7 7 7':'M9 5l7 7-7 7'}"/></svg>`;

function render(){
  $('#mode').textContent=!S.loaded?'Carregando…':S.local?'Salvo neste celular':'Sincronizado';
  $('#bkbtn').hidden=!(S.loaded&&S.local);
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===S.view)));
  const af=document.activeElement&&document.activeElement.id;
  $('#view').innerHTML=!S.loaded?'<p class="note">Carregando seus hábitos…</p>':S.view==='hoje'?viewDay():S.view==='mes'?viewMes():S.view==='projeto'?viewProjeto():S.view==='dieta'?viewDiet():S.view==='treino'?viewTreino():S.view==='livros'?viewBooks():S.view==='tarefas'?viewTasks():viewHist();
  const q=$('#q-title');if(q){q.value=S.quickDraft||'';if(af==='q-title')q.focus()}
  if(!S.editing)renderSheet();
}

function viewDay(){
  const d=S.day,t=today();
  if(S.local&&!S.habits.length)return `<div class="empty"><h2>Entre para ver seus hábitos</h2>
    <p>Seus hábitos, livros e tarefas ficam salvos na sua conta Claude. Toque em <strong>Entrar</strong>, no topo da página, e faça login. Depois disso, o Safari guarda o acesso.</p></div>`;
  if(!S.habits.length)return `<div class="empty"><h2>Comece com poucos hábitos</h2>
    <p>Marque cada hábito todos os dias. Você vê a sequência, a semana e o mês. Comece com 3 a 6 hábitos que você consegue cumprir mesmo em dia de plantão.</p>
    <div class="row"><button class="addbtn" data-act="new">+ Criar hábito</button><button class="ghost" data-act="starters">Usar sugestões</button></div></div>`;
  const hs=S.habits.filter(h=>existsOn(h,d));
  const daily=hs.filter(h=>(h.freq||7)>=7);const doneDaily=daily.filter(h=>isDone(h,d)).length;
  const pct=dayPct(d);const P=pct==null?0:pct;
  const C=2*Math.PI*34;
  const ws=weekStart(d);
  let week='';for(let i=0;i<7;i++){const x=addD(ws,i);const p=x>t?null:dayPct(x);
    week+=`<button class="wd ${x===d?'sel':''} ${x>t?'future':''}" ${x>t?'disabled':''} data-day="${x}" aria-label="${niceDay(x)}"><span class="dot"><i style="height:${Math.round((p||0)*100)}%"></i></span>${DOW1[i]}</button>`}
  const left=daily.length-doneDaily;
  const msg=!daily.length?'Seus hábitos são semanais. Marque quando fizer.':left===0?'<strong>Tudo feito.</strong> Dia completo.':`<strong>${left} ${left===1?'hábito diário falta':'hábitos diários faltam'}</strong>${d===t?' hoje':''}.`;
  let groups='';
  CATS.forEach(([k,label])=>{const list=hs.filter(h=>h.cat===k);if(!list.length)return;
    groups+=`<section class="group"><div class="ghead"><span class="sw cat-${k}" style="background:var(--c)"></span><span class="eyebrow">${label}</span></div><div class="list">${list.map(h=>habitRow(h,d)).join('')}</div></section>`});
  return `<div class="wrap" style="padding:0">
    <div class="daynav"><button class="iconbtn" data-nav="-1" aria-label="Dia anterior">${ARW(-1)}</button><h1>${niceDay(d)}</h1>
      ${d!==t?'<button class="chip link" data-act="gotoday">Ir para hoje</button>':''}
      <button class="iconbtn" data-nav="1" aria-label="Próximo dia" ${d>=t?'disabled':''}>${ARW(1)}</button></div>
    <div class="summary">
      <svg class="ring" width="88" height="88" viewBox="0 0 88 88" role="img" aria-label="${Math.round(P*100)}% concluído">
        <circle cx="44" cy="44" r="34" fill="none" stroke="var(--sunk)" stroke-width="9"/>
        <circle cx="44" cy="44" r="34" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="${(C*P).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 44 44)"/>
        <text x="44" y="50" text-anchor="middle" font-size="19">${Math.round(P*100)}%</text></svg>
      <div class="sumtext"><p>${msg}</p><div class="week">${week}</div></div>
    </div>
    ${groups}
    <button class="addbtn" data-act="new">+ Novo hábito</button>
  </div>`;
}
function habitRow(h,d){
  const done=isDone(h,d);const st=streak(h);const v=Number(getVal(d,h.id))||0;
  const weekly=(h.freq||7)<7;const wc=weekly?weekCount(h,weekStart(d)):0;
  const meta=[];
  if(st.n>0)meta.push(`<span class="streak">${st.n} ${st.u}</span>`);
  if(weekly)meta.push(`${wc} de ${h.freq} nesta semana`);
  if(h.kind==='count')meta.push(`meta ${fmt(h.goal)} ${esc(h.unit||'')}`);
  if(!meta.length)meta.push(weekly?'':'todo dia');
  const main=`<button class="hinfo" data-edit="${h.id}"><span class="hname">${esc(h.name)}</span><span class="hmeta">${meta.join('')?meta.map(m=>`<span>${m}</span>`).join(''):''}</span></button>`;
  if(h.kind==='count'){
    const step=stepOf(h);
    return `<div class="habit cat-${h.cat} ${done?'done':''}">
      <button class="check" data-toggle="${h.id}" aria-label="Marcar meta de ${esc(h.name)}" aria-pressed="${done}">${CHECK}</button>${main}
      <div class="stepper"><button data-inc="${h.id}" data-by="${-step}" aria-label="Diminuir">−</button><span class="val">${fmt(v)}</span><button data-inc="${h.id}" data-by="${step}" aria-label="Aumentar">+</button></div>
      <div class="bar"><i style="width:${Math.min(100,Math.round(v/(h.goal||1)*100))}%"></i></div></div>`}
  return `<div class="habit cat-${h.cat} ${done?'done':''}"><button class="check" data-toggle="${h.id}" aria-label="Marcar ${esc(h.name)}" aria-pressed="${done}">${CHECK}</button>${main}<span></span></div>`;
}
/* ---------- dieta (plano da nutricionista Luanne Rocha) ---------- */
let PLAN=[
 {id:'h-cafe',time:'05:40',title:'Café da manhã',opts:[
   {n:'Pão com ovo e fruta',i:'<b>1 pão francês</b> · 2 ovos · 30g requeijão light · 1 kiwi · café sem açúcar'},

 {id:'h-almoco',time:'12:30',title:'Almoço',opts:[

  subs:['<b>Iogurte proteico:</b> Itambé Pro, Verde Campo, YoPro, Dux, Piracanjuba, Moo. Ou iogurte natural desnatado + 20g whey','<b>Uva</b> → 1 tangerina média ou 2 ameixas pequenas','<b>Queijo minas</b> → 20g requeijão light ou 10g parmesão ralado']},
 {id:'h-jantar',time:'21:30',title:'Jantar',opts:[

   {n:'Japa ou poke (1× na semana)',i:'<b>12 a 14 peças</b>. Poke: metade arroz, metade salada ou palmito pupunha, sem fritos e sem cream cheese'}],
  subs:['<b>Arroz</b> → 80g macarrão, arroz integral ou mandioca; ou 160g batata inglesa','<b>Frango</b> → 1 sobrecoxa (65g), 80g patinho, 140g tilápia ou 2 ovos','<b>Pão francês</b> → 2 fatias pão de forma integral','<b>Mussarela light</b> → 15g queijo prato ou 20g queijo minas light']}];
let METAS=['Pelo menos 1 atividade física no fim de semana (mínimo 30 min de cardio se a rotina estiver corrida)','120 min de cardio por dia','2 taças de vinho quando for beber','1 refeição livre por semana, de preferência sábado à noite','Sábado ou domingo à noite: meia refeição livre com pizza So Good ou poke (com arroz e cream cheese)'];
const mealHabit=p=>S.habits.find(h=>h.id===p.id)||{id:p.id,kind:'check'};
function viewDiet(){

const cardioTag=(m,i)=>CARDIO[m].label+' · Treino '+(i+1);
function nextCardio(m){const t=today();for(let k=0;k<120;k++){const d=addD(t,-k);const v=getVal(d,'h-cardio');
  if(typeof v==='string'&&v.startsWith(CARDIO[m].label)){const n=parseInt(v.split('Treino ')[1])||0;return n%4}}return 0}
function wkDots(id){const h=S.habits.find(x=>x.id===id)||{id,kind:'check',freq:2};const c=weekCount(h,weekStart(S.day));const f=h.freq||2;
  let s='';for(let i=0;i<Math.max(f,c);i++)s+=`<i class="${i<c?'on':''}"></i>`;return {c,f,dots:`<span class="wk">${s}</span>`}}
function wHead(id,time,title){const h=S.habits.find(x=>x.id===id)||{id,kind:'check'};const ok=isDone(h,S.day);const v=getVal(S.day,id);const w=wkDots(id);
  return {ok,html:`<div class="mhd"><button class="check" data-wcheck="${id}" aria-pressed="${ok}" aria-label="Marcar ${title}">${CHECK}</button>
    <div><span class="time" style="display:flex;gap:8px;align-items:center">${time} ${w.dots}</span><h3>${title}</h3><span class="sub">${ok?(typeof v==='string'?'Feito · '+esc(v):'Feito'):w.c+' de '+w.f+' nesta semana'}</span></div></div>`}}

    <section class="meal move ${f.ok?'done':''}">${f.html}<details class="more" style="padding:0" data-k="fb" ${S.open&&S.open.fb?'open':''}><summary style="padding-inline:14px">Ver exercícios</summary><div>${fb}</div></details></section>
    <section class="meal move ${c.ok?'done':''}">${c.html}

const stepOf=h=>h.goal>=5000?1000:h.goal>=500?100:h.goal>=50?10:1;

function viewHist(){
  if(!S.habits.length)return `<div class="empty"><h2>Sem histórico ainda</h2><p>Crie seu primeiro hábito na aba Dia. O calendário se preenche conforme você marca.</p><div class="row"><button class="addbtn" data-act="new">+ Criar hábito</button></div></div>`;
  const [y,m]=S.month.split('-').map(Number);const first=new Date(y,m-1,1);const t=today();
  const days=new Date(y,m,0).getDate();const off=(first.getDay()+6)%7;
  let cells=DOW1.map(x=>`<span class="dow">${x}</span>`).join('');for(let i=0;i<off;i++)cells+='<span></span>';
  for(let i=1;i<=days;i++){const d=`${y}-${pad(m)}-${pad(i)}`;const fut=d>t;const p=fut?null:dayPct(d);
    const lv=p==null?0:p===0?0:p<.34?1:p<.67?2:p<1?3:4;
    cells+=`<button class="cell lv${lv} ${d===t?'today':''} ${fut?'future':''}" ${fut?'disabled':''} data-day="${d}" aria-label="${i} de ${MES[m-1]}${p!=null?': '+Math.round(p*100)+'%':''}">${i}</button>`}
  const canNext=S.month<t.slice(0,7);
  const stats=S.habits.map(h=>{const r=rate30(h);const st=streak(h);let strip='';
    for(let i=27;i>=0;i--){const d=addD(t,-i);const v=getVal(d,h.id);const on=isDone(h,d);const part=!on&&h.kind==='count'&&Number(v)>0;
      strip+=`<i class="${on?'on':part?'part':''}" title="${d}"></i>`}
    return `<div class="hstat cat-${h.cat}"><div><div class="hname">${esc(h.name)}</div><div class="hmeta"><span>${(h.freq||7)>=7?'todo dia':h.freq+'× por semana'}</span><span class="streak">${st.n} ${st.u}</span></div></div>
      <div class="pct">${r==null?'–':Math.round(r*100)+'%'}</div><div class="strip" aria-label="Últimos 28 dias">${strip}</div></div>`}).join('');
  return `<div class="wrap" style="padding:0">
    <div class="card"><div class="mhead"><button class="iconbtn" data-month="-1" aria-label="Mês anterior">${ARW(-1)}</button><h2>${MES[m-1][0].toUpperCase()+MES[m-1].slice(1)} ${y}</h2><button class="iconbtn" data-month="1" aria-label="Próximo mês" ${canNext?'':'disabled'}>${ARW(1)}</button></div>
      <div class="cal">${cells}</div>
      <div class="legend">Menos <span style="background:var(--sunk)"></span><span class="cell lv1" style="padding:0;width:12px;height:12px;border-radius:3px"></span><span class="cell lv2" style="padding:0;width:12px;height:12px;border-radius:3px"></span><span class="cell lv3" style="padding:0;width:12px;height:12px;border-radius:3px"></span><span style="background:var(--accent)"></span> Mais · toque num dia para editar</div>
    </div>
    <div class="card"><div class="mhead"><h2>Por hábito</h2><span class="eyebrow">últimos 30 dias</span></div>${stats}
      <p class="note">Hábitos semanais contam a meta da semana. Eles não baixam a nota dos dias em que você não fez.</p></div>
  </div>`;
}

const PRI=[['urgente','Urgente'],['importante','Importante'],['necessario','Necessário']];
const TCHECK='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--surface)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function dueLabel(d){if(!d)return'';const t=today();if(d===t)return'hoje';if(d===addD(t,1))return'amanhã';if(d===addD(t,-1))return'ontem';const x=pd(d);return x.getDate()+' '+MES[x.getMonth()].slice(0,3)}
function taskRow(t){const late=!t.done&&t.due&&t.due<today();
  return `<div class="task pri-${t.pri} ${t.done?'done':''}"><button class="check" data-ttoggle="${t.id}" aria-pressed="${!!t.done}" aria-label="Concluir ${esc(t.title)}">${TCHECK}</button>
  <button class="hinfo" data-edittask="${t.id}"><span class="hname">${esc(t.title)}</span>${t.due||t.note?`<span class="hmeta">${t.due?`<span class="due ${late?'late':''}">${late?'atrasada · ':''}${dueLabel(t.due)}</span>`:''}${t.note?`<span>${esc(t.note)}</span>`:''}</span>`:''}</button></div>`}
function viewTasks(){const open=S.tasks.filter(t=>!t.done);const done=S.tasks.filter(t=>t.done).sort((a,b)=>(b.doneAt||'').localeCompare(a.doneAt||''));
  const byDue=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(a.createdAt||'').localeCompare(b.createdAt||'');

  </div>`}
function openTask(id){const t=S.tasks.find(x=>x.id===id);if(!t)return;S.editing={...t,_type:'task',_arm:false,_err:''};renderSheet()}

/* ---------- mês: dashboard de novembro ---------- */
const MX={first:'2026-11-01',start:'2026-11-08',last:'2026-11-30'};

function normM(m){m=m&&typeof m==='object'?m:{};m.goals=m.goals||{};Object.keys(GDEF).forEach(k=>m.goals[k]={...GDEF[k],...(m.goals[k]||{})});m.days=m.days||{};m.sun=m.sun||{};if(!m.v){if(Number(m.goals.mestrado.target)===720)m.goals.mestrado.target=600;m.v=2}return m}

const clampM=d=>d<MX.first?MX.first:d>MX.last?MX.last:d;

  return r.b.map(([t,k])=>k[0]==='!'?{t,key:k,fixed:true,n:k==='!Viagem'?(tr?'Viagem · '+tr[2]:'Viagem'):k.slice(1)}:{t,key:k,...BK[k]})}
function eachDay(a,b,f){for(let d=a;d<=b;d=addD(d,1))f(d)}

function bDone(d,b){return b.h?!!getVal(d,b.h):!!(M.days[d]&&M.days[d].b&&M.days[d].b[b.key])}
function earned(g,a,b){let s=0;eachDay(a,b,d=>{if(g==='treino')s+=trCount(d);else blocksOf(d).forEach(x=>{if(x.g===g&&bDone(d,x))s+=x.v})});return s}
function planned(g,a,b){let s=0;if(a>b)return 0;eachDay(a,b,d=>blocksOf(d).forEach(x=>{if(x.g===g)s+=x.v}));return s}
function antesOf(g){const v=M.goals[g].antes;if(g==='treino'&&(v==null||v===''))return earned('treino',MX.first,addD(MX.start,-1));return Number(v)||0}
function gStat(g){const G=M.goals[g],t=today();const target=Number(G.target)||0;const antes=antesOf(g);
  const done=antes+earned(g,MX.start,MX.last);

  const falta=Math.max(0,target-done);const st=done>=target?'hit':done>=0.9*exp?'ok':'late';
  return {g,G,target,antes,done,exp,falta,rd,perDay:rd?falta/rd:falta,perWeek:rd?falta/Math.max(1,rd/7):falta,st}}
const hm=n=>{n=Math.round(n);const h=Math.floor(n/60),m=n%60;return h?h+'h'+(m?pad(m):''):m+' min'};

function fRate(g,n,per){if(g==='mestrado')return hm(Math.ceil(n));if(g==='logos')return Math.ceil(n)+' pág';return fmt(Math.round(n*10)/10)+(per==='d'?'':'')}
function mDayTitle(d){const x=pd(d);return (d===today()?'Hoje · ':'')+['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][x.getDay()]+', '+x.getDate()+' nov'}

  return `<div class="daynav"><button class="iconbtn" data-mnav="-1" aria-label="Dia anterior" ${d<=MX.first?'disabled':''}>${ARW(-1)}</button><h1 style="font-size:clamp(22px,6vw,30px)">${mDayTitle(d)}</h1>

function mSemana(){const ws=weekStart(S.mday),t=today();const stats=Object.keys(GMETA).map(gStat);
  let days='';for(let i=0;i<7;i++){const d=addD(ws,i);if(d<MX.first||d>MX.last)continue;
    const chips=blocksOf(d).map(b=>b.fixed?`<span class="bchip fixed">${esc(b.n)}</span>`:`<span class="bchip g-${b.g||'none'} ${bDone(d,b)?'done':''}">${esc(b.t.split('–')[0])} ${esc(b.g==='treino'?b.n.split(' ·')[0]:b.g?GMETA[b.g].s:b.n.split(' (')[0])}</span>`).join('');

  return `<div class="card"><div class="mhead"><button class="iconbtn" data-mweek="-1" aria-label="Semana anterior" ${ws<=weekStart(MX.first)?'disabled':''}>${ARW(-1)}</button><h2>${dd(ws<MX.first?MX.first:ws)} – ${dd(addD(ws,6)>MX.last?MX.last:addD(ws,6))}</h2><button class="iconbtn" data-mweek="1" aria-label="Próxima semana" ${addD(ws,7)>MX.last?'disabled':''}>${ARW(1)}</button></div>

function mMetas(){return Object.keys(GMETA).map(g=>{const s=gStat(g);const G=s.G;

document.addEventListener('input',ev=>{const e=ev.target;if(!e.dataset)return;

function mClick(ds_){

  if(ds_.mblock){const d=S.mday;if(d>today())return true;const b=blocksOf(d).find(x=>x.key===ds_.mblock);if(!b)return true;const on=bDone(d,b);

  p.meta={inicio:'2026-11-21',pesoIni:58,alvo:56,data:'2027-02-28',defMin:300,defMax:500,...(p.meta||{})};
  p.days=p.days||{};p.peso=p.peso||{};p.med=p.med||{};p.fotos=p.fotos||{};p.foods=Array.isArray(p.foods)?p.foods:[];p.v=1;return p}
let P=normP((()=>{try{return JSON.parse(localStorage.getItem(LSPJ))}catch(e){return null}})());
function saveP(){try{localStorage.setItem(LSPJ,JSON.stringify(P))}catch(e){}}
const pday=d=>P.days[d]||(P.days[d]={});
const allFoods=()=>[...P.foods,...FOODS];
const foodById=id=>allFoods().find(f=>f.id===id);
const r0=n=>Math.round(Number(n)||0);
const r1=n=>Math.round((Number(n)||0)*10)/10;
const fk=n=>fmt(r0(n))+' kcal';
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const num=v=>{const x=Number(String(v==null?'':v).replace(',','.'));return isFinite(x)?x:0};
function mkItem(f,q,ui,auto){ui=Math.min(ui||0,f.u.length-1);const g=q*f.u[ui][1];
  return {id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),fid:f.id,n:f.n,q,ul:f.u[ui][0],g,kcal:f.k*g/100,p:f.p*g/100,...(auto?{auto}:{})}}
function qLabel(it){const isBase=it.ul==='g'||it.ul==='ml';return isBase?fmt(r0(it.q))+' '+it.ul:fmt(r1(it.q))+' '+it.ul+(it.q!==1&&!/\)$/.test(it.ul)?'':'')}

/* ---------- contas ---------- */
function pesoEm(d){const ks=Object.keys(P.peso).filter(k=>k<=d).sort();return ks.length?P.peso[ks[ks.length-1]]:P.perfil.peso}
function media7(d){const a=addD(d,-6);const v=Object.keys(P.peso).filter(k=>k>=a&&k<=d).map(k=>P.peso[k]);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null}
function bmr(d){const pr=P.perfil;return 10*pesoEm(d)+6.25*pr.altura-5*pr.idade-161}
function exKcal(e,d){if(e.kcal!=null&&e.kcal!=='')return num(e.kcal);const t=EXT[e.t]||EXT.outro;const met=t.m[e.int==null?1:e.int];return Math.max(0,(met-1)*pesoEm(d)*(num(e.min)/60))}
function dayCalc(d){const x=P.days[d]||{};let comido=0,prot=0,itens=0;
  PMEALS.forEach(([m])=>((x.f&&x.f[m])||[]).forEach(it=>{comido+=it.kcal;prot+=it.p;itens++}));
  const vinho=(x.vinho||0)*TACA;comido+=vinho;
  const base=bmr(d)*P.perfil.fator;const treino=(x.ex||[]).reduce((s,e)=>s+exKcal(e,d),0);
  return {comido,prot,vinho,base,treino,gasto:base+treino,deficit:base+treino-comido,itens,temReg:itens>0}}
function mealKcal(d,m){const x=P.days[d];return ((x&&x.f&&x.f[m])||[]).reduce((s,it)=>s+it.kcal,0)}

/* ---------- integração: marcar refeição do plano / treino preenche sozinho ---------- */
const EXSRC={'h-personal':['personal',60,1],'h-musculacao':['musc',50,1],'h-cardio':['bike',30,1]};
function pSync(date,hid,val){
  const p=PLAN.find(x=>x.id===hid);
  if(p){const x=pday(date);x.f=x.f||{};let arr=(x.f[hid]||[]).filter(it=>!it.auto);
    if(typeof val==='string'&&POPT[val]&&arr.length===0){arr=POPT[val].map(([fid,q,ui])=>{const f=foodById(fid);return f?mkItem(f,q,ui,val):null}).filter(Boolean)}
    x.f[hid]=arr;saveP();return}
  if(EXSRC[hid]){const x=pday(date);let ex=(x.ex||[]);const [t,min,int]=EXSRC[hid];
    if(!val){ex=ex.filter(e=>e.src!==hid)}
    else{let tt=t;if(hid==='h-cardio'&&typeof val==='string')tt=val.startsWith('Elíptico')?'eliptico':'bike';
      const ex0=ex.find(e=>e.src===hid);if(ex0){if(hid==='h-cardio'&&!ex0.edited)ex0.t=tt}else ex=[...ex,{id:'e'+Date.now().toString(36),t:tt,min,int,src:hid}]}
    x.ex=ex;saveP()}}
const _setLogOrig=setLog;
setLog=function(date,hid,val){try{pSync(date,hid,val)}catch(e){}return _setLogOrig(date,hid,val)};

/* ---------- Dieta: bloco de registro por refeição ---------- */
function pDietSummary(d){const c=dayCalc(d);
  return `<div class="card pbal"><div class="pbrow">${pStat('Consumido',fk(c.comido),'')}${pStat('Gasto',fk(c.gasto),'')}${pStat(c.deficit>=0?'Déficit':'Superávit',fk(Math.abs(c.deficit)),pDefCls(c,d))}</div>
    <p class="note">Proteína: <b>${r0(c.prot)} g</b> de 95–115 g${c.vinho?` · vinho: ${fk(c.vinho)}`:''}${!c.temReg?' · toque numa opção do plano ou em "+ alimento" para registrar':''}</p></div>`}
function pStat(l,v,cls){return `<div class="pst ${cls}"><span>${l}</span><b>${v}</b></div>`}
function pPend(d){const x=P.days[d]||{};return PLAN.filter(p=>!((x.f&&x.f[p.id])||[]).length).length}
function pDefCls(c,d){if(!c.temReg)return '';if(d===today()&&pPend(d)>0)return '';if(c.deficit<0)return 'bad';if(c.deficit>P.meta.defMax+250)return 'warn';return 'good'}
function pMealBlock(d,mid){const x=P.days[d];const arr=(x&&x.f&&x.f[mid])||[];const tot=arr.reduce((s,it)=>s+it.kcal,0);
  const rows=arr.map(it=>`<div class="pit"><button class="pitn" data-pedit="${mid}|${it.id}"><span>${esc(it.n)}</span><small>${qLabel(it)}${it.auto?' · do plano':''}</small></button><span class="pk">${r0(it.kcal)}</span><button class="px" data-pdel="${mid}|${it.id}" aria-label="Remover ${esc(it.n)}">×</button></div>`).join('');
  return `<div class="preg"><div class="preghd"><span class="eyebrow">O que comi</span><b>${fk(tot)}</b></div>${rows}<button class="padd" data-padd="${mid}">+ alimento</button></div>`}
function pExtraCard(d){return `<section class="meal"><div class="mhd" style="grid-template-columns:1fr"><div><span class="time">Fora do plano</span><h3>Extras e beliscos</h3><span class="sub">Lanche a mais, doce, refeição livre…</span></div></div>${pMealBlock(d,'extra')}</section>`}

/* ---------- Treino: gasto do dia ---------- */
function pExCard(d){const x=P.days[d]||{};const ex=x.ex||[];const c=dayCalc(d);
  const rows=ex.map(e=>`<div class="pit"><button class="pitn" data-pexedit="${e.id}"><span>${esc((EXT[e.t]||EXT.outro).n)}${e.nome?' · '+esc(e.nome):''}</span><small>${r0(e.min)} min · ${e.kcal!=null&&e.kcal!==''?'do relógio':INT[e.int==null?1:e.int]}</small></button><span class="pk">${r0(exKcal(e,d))}</span><button class="px" data-pexdel="${e.id}" aria-label="Remover atividade">×</button></div>`).join('');
  return `<div class="card" style="gap:8px"><div class="mhead"><h2 style="font-size:19px">Gasto de ${d===today()?'hoje':'neste dia'}</h2><b style="font-family:var(--f-display)">${fk(c.gasto)}</b></div>
    <p class="note">Corpo em repouso + rotina: ${fk(c.base)} · treinos: ${fk(c.treino)}</p>
    <div class="list">${rows||'<p class="note" style="padding:12px 14px">Nenhum treino neste dia. Ao marcar personal, fullbody ou cardio, ele entra aqui sozinho.</p>'}</div>
    <button class="padd" data-act="pexnew" style="align-self:flex-start">+ atividade</button>
    <p class="note">Tem relógio? Toque na atividade e coloque as calorias ativas dele. Fica mais preciso.</p></div>`}

/* ---------- Aba Projeto ---------- */
function viewProjeto(){S.psub=S.psub||'hoje';
  const subs=[['hoje','Hoje'],['semana','Semana'],['corpo','Corpo'],['ajustes','Ajustes']];
  const body=S.psub==='semana'?pSemana():S.psub==='corpo'?pCorpo():S.psub==='ajustes'?pAjustes():pHoje();
  return `<div class="wrap" style="padding:0"><div class="mseg">${subs.map(([k,l])=>`<button data-psub="${k}" aria-pressed="${S.psub===k}">${l}</button>`).join('')}</div>${body}</div>`}
function pHoje(){const d=S.day,t=today();const x=P.days[d]||{};const c=dayCalc(d);
  const ws=weekStart(d);const vin=wkSum(ws,dd=>(P.days[dd]&&P.days[dd].vinho)||0);
  const pend=pPend(d);const msg=!c.temReg?'Registre as refeições na aba Dieta para ver o déficit real.':d===t&&pend>0?`Dia em andamento: ${pend===1?'falta 1 refeição':'faltam '+pend+' refeições'}. O saldo fecha à noite.`:c.deficit<0?'Hoje passou do gasto. Tudo bem: o que conta é a semana.':c.deficit<P.meta.defMin?'Déficit pequeno, mas no caminho.':c.deficit<=P.meta.defMax+250?'Déficit na medida certa.':'Déficit grande demais. Coma mais proteína para proteger o músculo.';
  const habit=(lbl,meta,ctl,ok)=>`<div class="blk ${ok?'done':''}" style="grid-template-columns:1fr auto"><div class="hinfo"><span class="hname" style="text-decoration:none">${lbl}</span><span class="tm">${meta}</span></div>${ctl}</div>`;
  return `<div class="daynav"><button class="iconbtn" data-nav="-1" aria-label="Dia anterior">${ARW(-1)}</button><h1>${niceDay(d)}</h1>
      ${d!==t?'<button class="chip link" data-act="gotoday">Hoje</button>':''}<button class="iconbtn" data-nav="1" aria-label="Próximo dia" ${d>=t?'disabled':''}>${ARW(1)}</button></div>
    <div class="card pbal"><div class="pbrow">${pStat('Consumido',fk(c.comido),'')}${pStat('Gasto',fk(c.gasto),'')}${pStat(c.deficit>=0?'Déficit':'Superávit',fk(Math.abs(c.deficit)),pDefCls(c,d))}</div>
      <p class="note" style="font-size:13.5px">${msg} Meta: ${P.meta.defMin}–${P.meta.defMax} kcal por dia.</p>
      <div class="pbtns"><button class="ghost" data-tab="dieta">Registrar comida</button><button class="ghost" data-tab="treino">Registrar treino</button></div></div>
    <section class="group"><div class="ghead"><span class="eyebrow">Hábitos do projeto</span></div><div class="list">
      ${habit('Vinho',`${vin} de 4 taças na semana · ${fk((x.vinho||0)*TACA)} hoje`,`<div class="stepper"><button data-pvin="-1" aria-label="Menos uma taça">−</button><span class="val">${x.vinho||0}</span><button data-pvin="1" aria-label="Mais uma taça">+</button></div>`,vin<=4)}
      ${habit('Passos','meta 8.000',`<input class="pnum" type="number" inputmode="numeric" data-pfield="passos" value="${x.passos||''}" placeholder="0" aria-label="Passos">`,num(x.passos)>=8000)}
      ${habit('Sono','meta 7 h',`<input class="pnum" type="number" inputmode="decimal" step="0.5" data-pfield="sono" value="${x.sono||''}" placeholder="h" aria-label="Horas de sono">`,num(x.sono)>=7)}
      ${habit('Proteína','meta 95–115 g · soma da Dieta',`<b class="pval">${r0(c.prot)} g</b>`,c.prot>=95)}
      ${habit('Treinos','personal, fullbody ou cardio',`<b class="pval">${trCount(d)}</b>`,trCount(d)>0)}
      ${habit('Peso','em jejum, 2 a 3× por semana',`<input class="pnum" type="number" inputmode="decimal" step="0.1" data-ppeso="${d}" value="${P.peso[d]||''}" placeholder="kg" aria-label="Peso de hoje">`,!!P.peso[d])}
    </div></section>
    ${pMetaCard()}`}
function wkSum(ws,f){let s=0;for(let i=0;i<7;i++)s+=num(f(addD(ws,i)));return s}
function pSemana(){S.pws=S.pws||weekStart(today());const ws=S.pws,t=today();
  let def=0,dReg=0,musc=0,cardioMin=0,trein=0,vin=0,passos=[],sono=[];let rows='';
  for(let i=0;i<7;i++){const d=addD(ws,i);const x=P.days[d]||{};const c=dayCalc(d);const fut=d>t;
    if(!fut){trein+=trCount(d);if(c.temReg){def+=c.deficit;dReg++}
      (x.ex||[]).forEach(e=>{if(e.t==='musc'||e.t==='personal')musc++;if(['bike','eliptico','corrida'].includes(e.t))cardioMin+=num(e.min)});
      vin+=x.vinho||0;if(x.passos)passos.push(num(x.passos));if(x.sono)sono.push(num(x.sono))}
    rows+=`<button class="pday ${d===t?'today':''}" data-pgo="${d}" ${fut?'disabled':''}><span>${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][pd(d).getDay()]} ${pd(d).getDate()}</span><span>${c.temReg?fmt(r0(c.comido)):'—'}</span><span>${fut?'—':fmt(r0(c.gasto))}</span><span class="${c.temReg?(c.deficit<0?'bad':'good'):''}">${c.temReg?(c.deficit>=0?'−':'+')+fmt(Math.abs(r0(c.deficit))):'—'}</span></button>`}
  const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
  const kg=def/7700;
  const st=(l,v,ok,meta)=>`<div class="${ok?'okc':''}"><b>${v}</b><span>${l}${meta?` · ${meta}`:''}</span></div>`;
  return `<div class="card"><div class="mhead"><button class="iconbtn" data-pweek="-1" aria-label="Semana anterior">${ARW(-1)}</button><h2>${pd(ws).getDate()}/${pd(ws).getMonth()+1} – ${pd(addD(ws,6)).getDate()}/${pd(addD(ws,6)).getMonth()+1}</h2><button class="iconbtn" data-pweek="1" aria-label="Próxima semana" ${addD(ws,7)>t?'disabled':''}>${ARW(1)}</button></div>
    <div class="big" style="color:var(--diet)">${def>=0?'−':'+'}${fmt(Math.abs(r0(def)))} <small>kcal na semana</small></div>
    <p class="note">≈ ${r1(Math.abs(kg)).toLocaleString('pt-BR')} kg de gordura ${def>=0?'a menos':'a mais'} · ${dReg} ${dReg===1?'dia registrado':'dias registrados'}. Meta da semana: 2.100 a 3.500 kcal.</p>
    <div class="stats3 p6">${st('treinos',trein,trein>=5,'meta 5')}${st('musculação',musc,musc>=3,'meta 3')}${st('min de cardio',r0(cardioMin),cardioMin>=120,'120–150')}
      ${st('taças de vinho',vin,vin<=4,'até 4')}${st('passos/dia',passos.length?fmt(r0(avg(passos))):'—',avg(passos)>=8000,'8.000')}${st('h de sono',sono.length?r1(avg(sono)).toLocaleString('pt-BR'):'—',avg(sono)>=7,'7 h')}</div></div>
    <div class="list"><div class="pday head"><span>Dia</span><span>Comeu</span><span>Gastou</span><span>Saldo</span></div>${rows}</div>
    <p class="note">Toque num dia para abrir. A balança oscila; o saldo da semana é o que conta.</p>`}
function pMetaCard(){const m=P.meta,t=today();const atual=media7(t)??pesoEm(t);
  const tot=m.pesoIni-m.alvo;const feito=m.pesoIni-atual;const pct=tot>0?Math.max(0,Math.min(100,feito/tot*100)):0;
  const dias=Math.max(0,Math.round((pd(m.data)-pd(t))/864e5));const sem=dias/7;const falta=Math.max(0,atual-m.alvo);
  const durTot=Math.max(1,(pd(m.data)-pd(m.inicio))/864e5);const esp=m.pesoIni-tot*Math.min(1,Math.max(0,(pd(t)-pd(m.inicio))/864e5/durTot));
  return `<div class="card"><div class="mhead"><h2 style="font-size:19px">Meta: ${fmt(m.alvo)} kg até ${pd(m.data).getDate()}/${pd(m.data).getMonth()+1}</h2></div>
    <div class="big" style="color:var(--diet)">${r1(atual).toLocaleString('pt-BR')} <small>kg · média de 7 dias</small></div>
    <div class="gbar" style="--c:var(--diet)"><i style="width:${pct}%"></i></div>
    <p class="note">Falta ${r1(falta).toLocaleString('pt-BR')} kg em ${dias} dias${sem>0&&falta>0?` · ${r1(falta/sem).toLocaleString('pt-BR')} kg por semana`:''}. Esperado para hoje: ${r1(esp).toLocaleString('pt-BR')} kg.</p></div>`}
function pChart(){const m=P.meta;const ks=Object.keys(P.peso).sort();const W=320,H=170,L=34,R=8,T=10,B=24;
  const x0=pd(ks.length&&ks[0]<m.inicio?ks[0]:m.inicio),x1=pd(m.data);const span=Math.max(1,x1-x0);
  const vals=ks.map(k=>P.peso[k]);const lo=Math.floor(Math.min(m.alvo,...vals,m.pesoIni)-0.5),hi=Math.ceil(Math.max(m.alvo,...vals,m.pesoIni)+0.5);
  const X=d=>L+(pd(d)-x0)/span*(W-L-R),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g='';for(let v=lo;v<=hi;v++){g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`}
  const tgt=`<line x1="${X(m.inicio)}" y1="${Y(m.pesoIni)}" x2="${X(m.data)}" y2="${Y(m.alvo)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  const pts=ks.map(k=>`<circle cx="${X(k)}" cy="${Y(P.peso[k])}" r="2.5" fill="color-mix(in srgb,var(--diet) 45%,transparent)"/>`).join('');
  const avg=ks.map(k=>[k,media7(k)]).filter(a=>a[1]!=null);const path=avg.map((a,i)=>(i?'L':'M')+X(a[0]).toFixed(1)+' '+Y(a[1]).toFixed(1)).join(' ');
  const lbl=(d,a)=>`<text x="${X(d)}" y="${H-6}" text-anchor="${a}" font-size="10" fill="var(--muted)">${pd(d).getDate()}/${pd(d).getMonth()+1}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfico do peso: pontos são pesagens, linha é a média de 7 dias, tracejado é o caminho até a meta">${g}${tgt}${pts}${path?`<path d="${path}" fill="none" stroke="var(--diet)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:''}${lbl(addD(m.inicio,0),'start')}${lbl(m.data,'end')}</svg>`}
function pCorpo(){const t=today();const mk=Object.keys(P.med).sort();const first=mk.length?P.med[mk[0]]:null;const last=mk.length?mk[mk.length-1]:null;
  const prox=last?Math.max(0,14-Math.round((pd(t)-pd(last))/864e5)):0;const cur=P.med[t]||{};
  const diff=(a,b)=>{if(a==null||b==null||a===''||b==='')return '';const d=r1(num(a)-num(b));return d===0?'':` <small class="${d<0?'good':'bad'}">${d>0?'+':''}${d.toLocaleString('pt-BR')}</small>`};
  const medRows=mk.slice().reverse().map(k=>{const v=P.med[k];return `<div class="pday"><span>${pd(k).getDate()}/${pd(k).getMonth()+1}</span><span>${v.cintura||'—'}${k!==mk[0]?diff(v.cintura,first.cintura):''}</span><span>${v.quadril||'—'}${k!==mk[0]?diff(v.quadril,first.quadril):''}</span><span>${v.coxa||'—'}${k!==mk[0]?diff(v.coxa,first.coxa):''}</span></div>`}).join('');
  const pesos=Object.keys(P.peso).sort().reverse().slice(0,6).map(k=>`<div class="pit"><span class="pitn" style="cursor:default"><span>${niceDay(k)}</span></span><span class="pk">${r1(P.peso[k]).toLocaleString('pt-BR')} kg</span><button class="px" data-ppdel="${k}" aria-label="Apagar pesagem">×</button></div>`).join('');
  const ym=t.slice(0,7);const mesN=MES[+ym.slice(5)-1];
  return `${pMetaCard()}
    <div class="card"><div class="mhead"><h2 style="font-size:19px">Peso</h2></div>${pChart()}
      <p class="note">Pontos: cada pesagem. Linha verde: média de 7 dias. Tracejado: caminho até a meta.</p>
      <div class="inline" style="align-items:flex-end"><div class="field"><label for="pp-in">Peso de hoje (kg)</label><input id="pp-in" type="number" inputmode="decimal" step="0.1" data-ppeso="${t}" value="${P.peso[t]||''}" placeholder="ex.: 57,6"></div></div>
      ${pesos?`<div class="list">${pesos}</div>`:''}</div>
    <div class="card"><div class="mhead"><h2 style="font-size:19px">Medidas</h2><span class="badge ${prox===0?'late':'ok'}">${prox===0?'medir hoje':'em '+prox+' dias'}</span></div>
      <p class="note">A cada 2 semanas, em cm: cintura na altura do umbigo, quadril na parte mais larga, coxa no meio.</p>
      <div class="inline">${[['cintura','Cintura'],['quadril','Quadril'],['coxa','Coxa']].map(([k,l])=>`<div class="field" style="min-width:80px"><label for="pm-${k}">${l}</label><input id="pm-${k}" type="number" inputmode="decimal" step="0.5" data-pmed="${k}" value="${cur[k]||''}" placeholder="cm"></div>`).join('')}</div>
      ${medRows?`<div class="list"><div class="pday head"><span>Data</span><span>Cintura</span><span>Quadril</span><span>Coxa</span></div>${medRows}</div><p class="note">O número pequeno é a diferença desde a primeira medida.</p>`:''}</div>
    <div class="card"><div class="mhead"><h2 style="font-size:19px">Foto do mês</h2></div>
      <div class="blk ${P.fotos[ym]?'done':''}" style="padding:0;border:0"><button class="check" data-pfoto="${ym}" aria-pressed="${!!P.fotos[ym]}" aria-label="Foto de ${mesN} feita" style="--c:var(--diet)">${CHECK}</button><div class="hinfo"><span class="hname">Foto de ${mesN} feita</span><span class="tm">Mesma luz, posição e horário. Guarde no álbum do celular.</span></div><span></span></div></div>`}
function pAjustes(){const pr=P.perfil,m=P.meta;const fat=[[1.25,'Pouco ativa'],[1.35,'Rotina de hospital'],[1.45,'Muito ativa']];
  const f=(id,l,k,obj,attrs)=>`<div class="field"><label for="${id}">${l}</label><input id="${id}" data-paj="${obj}.${k}" value="${esc((obj==='perfil'?pr:m)[k])}" ${attrs}></div>`;
  const own=P.foods.map(x=>`<div class="pit"><span class="pitn" style="cursor:default"><span>${esc(x.n)}</span><small>${r0(x.k)} kcal e ${r1(x.p)} g de proteína por 100 ${x.ml?'ml':'g'}${x.u.length>1?' · '+esc(x.u[1][0])+' = '+x.u[1][1]+' g':''}</small></span><span></span><button class="px" data-pfdel="${x.id}" aria-label="Apagar alimento">×</button></div>`).join('');
  return `<div class="card"><h2 style="font-size:19px">Meta</h2>
      <div class="inline">${f('aj-alvo','Peso alvo (kg)','alvo','meta','type="number" inputmode="decimal" step="0.1"')}${f('aj-data','Data alvo','data','meta','type="date"')}</div>
      <div class="inline">${f('aj-ini','Peso no início (kg)','pesoIni','meta','type="number" inputmode="decimal" step="0.1"')}${f('aj-inicio','Início','inicio','meta','type="date"')}</div>
      <div class="inline">${f('aj-dmin','Déficit mínimo/dia','defMin','meta','type="number" inputmode="numeric"')}${f('aj-dmax','Déficit máximo/dia','defMax','meta','type="number" inputmode="numeric"')}</div></div>
    <div class="card"><h2 style="font-size:19px">Seu corpo</h2>
      <div class="inline">${f('aj-alt','Altura (cm)','altura','perfil','type="number" inputmode="numeric"')}${f('aj-id','Idade','idade','perfil','type="number" inputmode="numeric"')}</div>
      <div class="field"><span class="lbl">Rotina fora do treino</span><div class="seg">${fat.map(([v,l])=>`<button data-pfat="${v}" aria-pressed="${pr.fator===v}">${l}</button>`).join('')}</div></div>
      <p class="note">Como o app calcula: gasto em repouso pela fórmula de Mifflin-St Jeor (${fk(bmr(today()))} hoje, usando seu último peso) × rotina (${String(pr.fator).replace('.',',')}) + treinos. Treino = (MET − 1) × peso × horas, ou as calorias ativas do relógio, se você colocar. Os números são estimativas: use a tendência das semanas, não um dia isolado.</p></div>
    <div class="card"><div class="mhead"><h2 style="font-size:19px">Meus alimentos</h2><button class="ghost" data-act="pfoodnew">+ novo</button></div>
      ${own?`<div class="list">${own}</div>`:'<p class="note">Cadastre aqui o que não está na lista, usando o rótulo (kcal e proteína por 100 g ou por porção).</p>'}</div>`}

/* ---------- folhas (sheets) ---------- */
function pSheet(e,host){
  if(e._type==='padd'){const q=norm(e.q);const list=allFoods().filter(f=>!q||norm(f.n).includes(q)).slice(0,40);
    const meal=(PMEALS.find(m=>m[0]===e.meal)||[])[1]||'';
    if(e.fid){const f=foodById(e.fid);const ui=e.ui||0;const qv=num(e.qty);const g=qv*f.u[ui][1];
      host.innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-label="Adicionar ${esc(f.n)}"><h2>${esc(f.n)}</h2>
        <p class="note">${r0(f.k)} kcal e ${r1(f.p)} g de proteína por 100 ${f.ml?'ml':'g'}</p>
        <div class="inline" style="align-items:flex-end"><div class="field" style="max-width:120px"><label for="pq">Quantidade</label><input id="pq" type="number" inputmode="decimal" step="any" data-pq value="${esc(e.qty)}"></div>
        <div class="field"><span class="lbl">Medida</span><div class="seg">${f.u.map((u,i)=>`<button data-pui="${i}" aria-pressed="${i===ui}">${esc(u[0])}${i?` (${u[1]} ${f.ml?'ml':'g'})`:''}</button>`).join('')}</div></div></div>
        <div class="pprev" id="pprev">${pPrev(f,qv,ui)}</div>
        <div class="actions"><button class="ghost" data-act="pback">Voltar</button><button class="primary" data-act="pconfirm">${e.edit?'Salvar':'Adicionar em '+esc(meal)}</button></div></div></div>`;return}
    host.innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-label="Adicionar alimento"><h2>${esc(meal)}</h2>
      <div class="field"><label for="psearch">Buscar alimento</label><input id="psearch" data-psearch value="${esc(e.q||'')}" placeholder="ex.: arroz, ovo, banana" autocomplete="off" enterkeyhint="search"></div>
      <div class="list pres" id="pres">${pResList(list)}</div>
      <div class="actions"><button class="ghost" data-act="pfoodnew">Cadastrar alimento novo</button><button class="ghost" data-act="close">Fechar</button></div></div></div>`;return}
  if(e._type==='pex'){const t=e.t||'musc';const it=e.int==null?1:e.int;
    host.innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-label="Atividade"><h2>${e.id?'Editar atividade':'Nova atividade'}</h2>
      <div class="field"><span class="lbl">Tipo</span><div class="seg">${Object.entries(EXT).map(([k,v])=>`<button data-pext="${k}" aria-pressed="${k===t}">${v.n}</button>`).join('')}</div></div>
      <div class="inline"><div class="field"><label for="pexmin">Minutos</label><input id="pexmin" type="number" inputmode="numeric" data-pexf="min" value="${esc(e.min)}"></div>
      <div class="field"><label for="pexk">Calorias ativas do relógio (opcional)</label><input id="pexk" type="number" inputmode="numeric" data-pexf="kcal" value="${e.kcal==null?'':esc(e.kcal)}" placeholder="deixe vazio para estimar"></div></div>
      <div class="field"><span class="lbl">Intensidade</span><div class="seg">${INT.map((l,i)=>`<button data-pexi="${i}" aria-pressed="${i===it}">${l}</button>`).join('')}</div></div>
      <div class="pprev" id="pprev">≈ <b>${fk(exKcal({t,min:e.min,int:it,kcal:e.kcal},S.day))}</b> gastos com o treino</div>
      <div class="actions"><button class="ghost" data-act="close">Cancelar</button><button class="primary" data-act="pexsave">Salvar</button></div></div></div>`;return}
  if(e._type==='pfood'){host.innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-label="Alimento novo"><h2>Alimento novo</h2>
      <div class="field"><label for="pfn">Nome</label><input id="pfn" data-pff="n" maxlength="50" value="${esc(e.n||'')}" placeholder="ex.: Barra de proteína X"></div>
      <div class="field"><span class="lbl">Os valores do rótulo são por</span><div class="seg"><button data-pfbase="100" aria-pressed="${e.base!=='porcao'}">100 g</button><button data-pfbase="porcao" aria-pressed="${e.base==='porcao'}">porção</button></div></div>
      ${e.base==='porcao'?`<div class="inline"><div class="field"><label for="pfpn">Nome da porção</label><input id="pfpn" data-pff="pn" maxlength="20" value="${esc(e.pn||'')}" placeholder="unidade"></div><div class="field"><label for="pfpg">Peso da porção (g)</label><input id="pfpg" type="number" inputmode="decimal" data-pff="pg" value="${esc(e.pg||'')}"></div></div>`:''}
      <div class="inline"><div class="field"><label for="pfk">Calorias (kcal)</label><input id="pfk" type="number" inputmode="decimal" data-pff="k" value="${esc(e.k||'')}"></div><div class="field"><label for="pfp">Proteína (g)</label><input id="pfp" type="number" inputmode="decimal" data-pff="p" value="${esc(e.p||'')}"></div></div>
      ${e._err?`<p class="err">${esc(e._err)}</p>`:''}
      <div class="actions"><button class="ghost" data-act="close">Cancelar</button><button class="primary" data-act="pfoodsave">Salvar</button></div></div></div>`;return}}
function pResList(list){return list.map(f=>`<button class="pres-i" data-pfood="${f.id}"><span>${esc(f.n)}</span><small>${r0(f.k)} kcal/100 ${f.ml?'ml':'g'}${f.u.length>1?' · '+esc(f.u[1][0])+' ≈ '+r0(f.k*f.u[1][1]/100):''}</small></button>`).join('')||'<p class="note" style="padding:12px 14px">Nada encontrado. Cadastre como alimento novo.</p>'}
function pPrev(f,q,ui){const g=q*f.u[ui][1];return `${fmt(r0(g))} ${f.ml?'ml':'g'} = <b>${fk(f.k*g/100)}</b> · ${r1(f.p*g/100).toLocaleString('pt-BR')} g de proteína`}
function pFindItem(mid,iid){const x=P.days[S.day];return x&&x.f&&x.f[mid]?x.f[mid].find(i=>i.id===iid):null}

/* ---------- eventos ---------- */
function pClick(ds_){
  if(ds_.psub){S.psub=ds_.psub;render();window.scrollTo(0,0);return true}
  if(ds_.pweek){S.pws=addD(S.pws||weekStart(today()),7*ds_.pweek);if(S.pws>today())S.pws=weekStart(today());render();return true}
  if(ds_.pgo){S.day=ds_.pgo;S.psub='hoje';render();window.scrollTo(0,0);return true}
  if(ds_.pvin){const x=pday(S.day);x.vinho=Math.max(0,(x.vinho||0)+(+ds_.pvin));saveP();render();return true}
  if(ds_.pfoto){P.fotos[ds_.pfoto]=!P.fotos[ds_.pfoto];saveP();render();if(P.fotos[ds_.pfoto])toast('Foto do mês marcada');return true}
  if(ds_.ppdel){delete P.peso[ds_.ppdel];saveP();render();return true}
  if(ds_.pfat){P.perfil.fator=+ds_.pfat;saveP();render();return true}
  if(ds_.pfdel){P.foods=P.foods.filter(f=>f.id!==ds_.pfdel);saveP();render();return true}
  if(ds_.padd){S.editing={_type:'padd',meal:ds_.padd,q:''};renderSheet();return true}
  if(ds_.pfood){const e=S.editing;if(!e)return true;const f=foodById(ds_.pfood);e.fid=f.id;e.ui=f.u.length>1?1:0;e.qty=f.u.length>1?1:100;renderSheet();return true}
  if(ds_.pui){const e=S.editing;const f=foodById(e.fid);const old=e.ui||0;const ni=+ds_.pui;const g=num(e.qty)*f.u[old][1];e.ui=ni;e.qty=r1(g/f.u[ni][1]);renderSheet();return true}
  if(ds_.pdel){const [m,i]=ds_.pdel.split('|');const x=pday(S.day);x.f=x.f||{};x.f[m]=(x.f[m]||[]).filter(it=>it.id!==i);saveP();render();return true}
  if(ds_.pedit){const [m,i]=ds_.pedit.split('|');const it=pFindItem(m,i);if(!it)return true;const f=foodById(it.fid);
    if(!f){toast('Esse alimento não está mais na lista');return true}
    const ui=Math.max(0,f.u.findIndex(u=>u[0]===it.ul));S.editing={_type:'padd',meal:m,fid:f.id,ui,qty:r1(it.q),edit:i};renderSheet();return true}
  if(ds_.pexedit){const x=pday(S.day);const e=(x.ex||[]).find(z=>z.id===ds_.pexedit);if(!e)return true;S.editing={_type:'pex',...e};renderSheet();return true}
  if(ds_.pexdel){const x=pday(S.day);const e=(x.ex||[]).find(z=>z.id===ds_.pexdel);x.ex=(x.ex||[]).filter(z=>z.id!==ds_.pexdel);saveP();
    if(e&&e.src&&getVal(S.day,e.src))_setLogOrig(S.day,e.src,false);else render();return true}
  if(ds_.pext){S.editing.t=ds_.pext;renderSheet();return true}
  if(ds_.pexi){S.editing.int=+ds_.pexi;renderSheet();return true}
  if(ds_.pfbase){S.editing.base=ds_.pfbase;renderSheet();return true}
  switch(ds_.act){
    case 'pback':S.editing.fid=null;renderSheet();setTimeout(()=>{const i=$('#psearch');i&&i.focus()},30);return true;
    case 'pconfirm':{const e=S.editing;const f=foodById(e.fid);const q=num(e.qty);if(q<=0){toast('Coloque a quantidade');return true}
      const x=pday(S.day);x.f=x.f||{};const arr=(x.f[e.meal]||[]).slice();const it=mkItem(f,q,e.ui||0);
      if(e.edit){const k=arr.findIndex(z=>z.id===e.edit);if(k>=0)arr[k]={...it,id:e.edit}}else arr.push(it);
      x.f[e.meal]=arr;saveP();S.editing=null;renderSheet();render();toast(e.edit?'Alterado':'+'+fk(it.kcal));return true}
    case 'pexnew':S.editing={_type:'pex',t:'bike',min:30,int:1};renderSheet();return true;
    case 'pexsave':{const e=S.editing;const x=pday(S.day);const k=e.kcal===''||e.kcal==null?null:num(e.kcal);
      const ne={id:e.id||'e'+Date.now().toString(36),t:e.t||'musc',min:num(e.min),int:e.int==null?1:e.int,...(k!=null?{kcal:k}:{}),...(e.src?{src:e.src}:{}),...(e.id?{edited:true}:{})};
      x.ex=x.ex||[];const i=x.ex.findIndex(z=>z.id===ne.id);if(i>=0)x.ex[i]=ne;else x.ex.push(ne);saveP();S.editing=null;renderSheet();render();toast('Treino salvo');return true}
    case 'pfoodnew':{const q=S.editing&&S.editing._type==='padd'?S.editing:null;S.editing={_type:'pfood',back:q,n:q&&q.q?q.q:'',base:'100'};renderSheet();return true}
    case 'pfoodsave':{const e=S.editing;const n=(e.n||'').trim();const k=num(e.k),p=num(e.p);
      if(!n||k<=0){e._err='Coloque o nome e as calorias.';renderSheet();return true}
      let k100=k,p100=p,u=[];if(e.base==='porcao'){const pg=num(e.pg);if(pg<=0){e._err='Coloque o peso da porção em gramas.';renderSheet();return true}
        k100=k/pg*100;p100=p/pg*100;u=[[(e.pn||'porção').trim()||'porção',pg]]}
      const f={id:'u'+Date.now().toString(36),n,k:k100,p:p100,u:[['g',1],...u],ml:false};P.foods.unshift(f);saveP();
      if(e.back){S.editing={...e.back,fid:f.id,ui:u.length?1:0,qty:u.length?1:100};}else S.editing=null;renderSheet();render();toast('Alimento salvo');return true}
  }
  return false}
document.addEventListener('input',ev=>{const t=ev.target;if(!t.dataset)return;const e=S.editing;
  if(t.dataset.psearch!=null&&e){e.q=t.value;const q=norm(t.value);const r=$('#pres');if(r)r.innerHTML=pResList(allFoods().filter(f=>!q||norm(f.n).includes(q)).slice(0,40))}
  if(t.dataset.pq!=null&&e){e.qty=t.value;const f=foodById(e.fid);const p=$('#pprev');if(p&&f)p.innerHTML=pPrev(f,num(t.value),e.ui||0)}
  if(t.dataset.pexf&&e){e[t.dataset.pexf]=t.value;const p=$('#pprev');if(p)p.innerHTML=`≈ <b>${fk(exKcal({t:e.t,min:e.min,int:e.int,kcal:e.kcal},S.day))}</b> gastos com o treino`}
  if(t.dataset.pff&&e){e[t.dataset.pff]=t.value}});
document.addEventListener('change',ev=>{const t=ev.target;if(!t.dataset)return;
  if(t.dataset.pfield){const x=pday(S.day);const v=num(t.value);if(t.value==='')delete x[t.dataset.pfield];else x[t.dataset.pfield]=v;saveP();render()}
  if(t.dataset.ppeso){const v=num(t.value);if(t.value===''||v<=0)delete P.peso[t.dataset.ppeso];else if(v<30||v>200){toast('Confira o peso');return}else P.peso[t.dataset.ppeso]=r1(v);saveP();render();if(v>0)toast('Peso salvo')}
  if(t.dataset.pmed){const d=today();const m=P.med[d]={...(P.med[d]||{})};if(t.value==='')delete m[t.dataset.pmed];else m[t.dataset.pmed]=r1(num(t.value));if(!Object.keys(m).length)delete P.med[d];saveP();render();toast('Medida salva')}
  if(t.dataset.paj){const [o,k]=t.dataset.paj.split('.');const tgt=o==='perfil'?P.perfil:P.meta;tgt[k]=t.type==='date'?t.value:num(t.value);saveP();render();toast('Salvo')}});
/* rolar a barra de abas até a aba ativa */
function pTabScroll(){const i=document.querySelector('.tabs .inner');const b=i&&i.querySelector('button[aria-selected="true"]');if(!b)return;
  const l=b.offsetLeft,r=l+b.offsetWidth;if(l<i.scrollLeft)i.scrollLeft=l-8;else if(r>i.scrollLeft+i.clientWidth)i.scrollLeft=r-i.clientWidth+8}
/* ---------- caixa de entrada: registros enviados pelo Claude (inbox.json) ---------- */
function pApplyInbox(o){if(!o||!Array.isArray(o.entries))return 0;P.applied=P.applied||{};let n=0,k=0;
  o.entries.forEach(e=>{if(!e||!e.id||P.applied[e.id]||!e.date)return;const x=pday(e.date);
    if(e.meal&&Array.isArray(e.items)){x.f=x.f||{};const arr=(x.f[e.meal]||[]).slice();
      e.items.forEach(([fid,q,ui])=>{const f=foodById(fid);if(f){const it=mkItem(f,num(q),ui||0);arr.push(it);k+=it.kcal}});x.f[e.meal]=arr}
    if(e.vinho)x.vinho=(x.vinho||0)+num(e.vinho);
    if(Array.isArray(e.ex))x.ex=[...(x.ex||[]),...e.ex.map(z=>({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:z.t||'outro',min:num(z.min),int:z.int==null?1:z.int,...(z.kcal!=null?{kcal:num(z.kcal)}:{})}))];
    if(e.peso)P.peso[e.date]=r1(num(e.peso));
    P.applied[e.id]=new Date().toISOString();n++});
  if(n){saveP();render();toast(k?'Claude registrou '+fk(k):'Registro do Claude adicionado')}return n}
function pFetchInbox(){try{if(!/^https?:/.test(location.protocol))return;fetch('inbox.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():null).then(pApplyInbox).catch(()=>{})}catch(e){}}
setTimeout(pFetchInbox,800);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pFetchInbox()});
const _renderOrig=render;render=function(){_renderOrig();try{pTabScroll()}catch(e){}};
if(S.loaded)render();
</script>

<script>document.addEventListener('touchend',function(e){var t=e.target;if(t&&t.matches&&t.matches('input:not([type=file]),textarea')&&document.activeElement!==t){t.focus()}},{passive:true});</script></body></html>
